# Gatus — sieve's view of the fleet.
#
# ${VARS} come from the container environment (see ../docker-compose.yml).
# Add an endpoint here when a stack lands on another node.
#
# Alert routing:
#   ntfy    → self-hosted ntfy on sieve, topic NTFY_ALERT_TOPIC. Everyday alerts.
#             (Straight to the container, not through Traefik, so a broken proxy
#             can still report itself.)
#   custom  → public ntfy.sh, topic NTFY_CRITICAL_TOPIC. For failures that stop the
#             self-hosted path from reaching a phone: ntfy itself, the tunnel.
#   Nothing on sieve can report sieve being down — healthchecks.io does that.

storage:
  type: sqlite
  path: /data/gatus.db

web:
  port: 8080

ui:
  title: PurrBrews status
  header: PurrBrews

alerting:
  ntfy:
    url: http://ntfy:8080
    topic: ${NTFY_ALERT_TOPIC}
    token: ${GATUS_NTFY_TOKEN}
    priority: 4
    click: https://gatus.${DOMAIN}
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
  custom:
    # JSON to ntfy.sh's root: Gatus fills placeholders in the url and body, not
    # in headers, so the title has to travel in the body. (As headers it arrived
    # as the literal "[ALERT_TRIGGERED_OR_RESOLVED]: [ENDPOINT_NAME]", and DOWN and
    # back up looked the same; found 2026-09-29.) Gatus escapes quotes in the
    # placeholder values, so the JSON stays valid.
    url: https://ntfy.sh
    method: POST
    body: |
      {
        "topic": "${NTFY_CRITICAL_TOPIC}",
        "title": "PurrBrews [ALERT_TRIGGERED_OR_RESOLVED]: [ENDPOINT_NAME]",
        "message": "[ENDPOINT_GROUP]/[ENDPOINT_NAME]: [ALERT_DESCRIPTION] [RESULT_ERRORS]",
        "priority": 5
      }
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        # The emoji live here, not in a fixed tag, so a recovery doesn't look
        # like an outage on a lock screen.
        TRIGGERED: "🚨 DOWN"
        RESOLVED: "✅ back up"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  # ── Dead man's switch ─────────────────────────────────────────────────────
  # Not a check: each run pings healthchecks.io. If sieve, Gatus or the internet
  # connection dies, the pings stop and healthchecks.io alerts on its own.
  - name: healthchecks.io heartbeat
    group: meta
    url: ${HEALTHCHECKS_PING_URL}
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  # ── Network (sieve) ───────────────────────────────────────────────────────
  - name: pihole → unbound (recursion)
    group: network
    url: ${NODE_IP}
    interval: 1m
    dns:
      query-name: cloudflare.com
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: ntfy
        description: LAN DNS is failing — clients will stall

  - name: pihole local override
    group: network
    url: ${NODE_IP}
    interval: 5m
    dns:
      query-name: gatus.${DOMAIN}
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == ${NODE_IP}"
    alerts:
      - type: ntfy
        description: "sieve's host names no longer resolve to sieve on the LAN"

  - name: pihole web
    group: network
    url: http://${NODE_IP}:8080/admin/
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: ntfy

  - name: traefik
    group: network
    url: http://traefik:8080/ping
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy
        description: sieve's reverse proxy is down — its web UIs are unreachable

  # Resolved through Pi-hole, like a LAN client. Checks the certificate and that
  # SSO answers: an unauthenticated request must be refused or sent to Authelia
  # (302/401). A 500 means Authelia on percolator is unreachable.
  - name: traefik certificate + sso
    group: network
    url: https://gatus.${DOMAIN}/
    interval: 15m
    client:
      dns-resolver: udp://${NODE_IP}:53
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 240h"
      - "[STATUS] == any(302, 401)"
    alerts:
      - type: ntfy
        description: certificate expiring within 10 days, or SSO not redirecting to login

  - name: cloudflare tunnel
    group: network
    url: http://cloudflared:2000/ready
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: tunnel down — nothing is reachable from outside

  - name: ntfy
    group: network
    url: http://ntfy:8080/v1/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].healthy == true"
    alerts:
      - type: custom
        description: self-hosted ntfy is down — routine alerts can't be delivered

  - name: ntfy (public)
    group: network
    url: https://ntfy.${DOMAIN}/v1/health
    interval: 5m
    # Resolve like a phone on mobile data. Through Pi-hole the name gets sieve's
    # LAN address, and the check never touched the tunnel: on 2026-09-29 the
    # tunnel's ntfy route was broken and this stayed green.
    client:
      dns-resolver: udp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
      - "[BODY].healthy == true"
    alerts:
      - type: custom
        description: ntfy isn't reachable through the tunnel — phones away from home get nothing

  - name: netalertx
    group: network
    url: http://${NODE_IP}:20211/
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: ntfy

  - name: gateway
    group: network
    url: icmp://${GATEWAY}
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy

  - name: internet
    group: network
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy
        description: no internet from sieve

  # ── Fleet ─────────────────────────────────────────────────────────────────
  # Node reachability, all four enabled 2026-09-29. roastery stays out: it sleeps
  # and wakes by Wake-on-LAN, so a ping would alert every night. Add each node's
  # app checks here as its stacks land.
  - name: percolator
    group: fleet
    url: icmp://192.168.0.11
    interval: 2m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]

  - name: cellar
    group: fleet
    url: icmp://192.168.0.12
    interval: 2m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]

  - name: mochaPot
    group: fleet
    url: icmp://192.168.0.13
    interval: 2m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]

  - name: grinder
    group: fleet
    url: icmp://192.168.0.14
    interval: 2m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]

  # ── persianPerch (cellar) ─────────────────────────────────────────────────
  # perch watches everything else; these two watch perch. /healthz is allowed from the fleet's node
  # addresses (sieve is one) without Authelia; the page itself must still be behind it.
  - name: perch
    group: fleet
    url: https://perch.${DOMAIN}/healthz
    interval: 1m
    client:
      dns-resolver: udp://${NODE_IP}:53
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    alerts:
      - type: ntfy
        description: persianPerch is down or unhealthy - nothing else is watching the fleet

  - name: perch page is behind sso
    group: fleet
    url: https://perch.${DOMAIN}/
    interval: 15m
    client:
      dns-resolver: udp://${NODE_IP}:53
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 240h"
      - "[STATUS] == any(302, 401)"
    alerts:
      - type: ntfy
        description: perch.${DOMAIN} is answering without a login, or its certificate is about to expire
