# Same node as ntfy, so these are copied straight across on every run.
NTFY_ALERT_TOPIC       mirror ntfy NTFY_ALERT_TOPIC
GATUS_NTFY_TOKEN       mirror ntfy GATUS_NTFY_TOKEN
# Public ntfy.sh topic for critical alerts. Anyone who knows the name can
# read it, so it's long and random. Treat it like a password.
NTFY_CRITICAL_TOPIC    hex 24 purrbrews-
HEALTHCHECKS_PING_URL  prompt healthchecks.io ping URL (https://hc-ping.com/…)
NOTE critical alerts: subscribe to NTFY_CRITICAL_TOPIC (gatus/secrets.env.local) on https://ntfy.sh
