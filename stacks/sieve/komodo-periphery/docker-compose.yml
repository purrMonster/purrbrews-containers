# Komodo Periphery — standalone agent added 2026-09-16 so cellar's Komodo
# Core (stacks/cellar/komodo/docker-compose.yml) can manage sieve's OWN
# containers too, not just cellar's. cellar's own Periphery shares a host
# directory with Core because they're on the same machine and Core writes
# its public key straight into that shared volume; sieve is a different
# physical host, so that trick doesn't work here. Copy cellar's own
# /srv/data/komodo/keys/core.pub BY HAND into ./keys/core.pub next to this
# file (create the keys/ directory first) before first bring-up — NOT
# templated through .env.local/secrets.env.local the way most values in
# this repo are: a multi-line PEM key doesn't round-trip safely through
# envsubst (see render-configs.sh) or a single-line `read -r` prompt (see
# generate-secrets.sh) the way a one-line secret does, so this one file is
# a deliberate exception to that convention, not an oversight.
#
# Periphery is the one that DIALS OUT to Core (ws://, outbound only) — see
# cellar/komodo/docker-compose.yml's own header comment for why. Nothing
# on sieve needs an inbound port opened or a firewall rule added for this
# agent; it only needs to reach cellar on port 9120 (already published —
# see that file's own comment on why it can't be closed off with ufw).
#
# CONFIRMED 2026-09-17: the public-key-only auth flow above is NOT
# sufficient by itself for a cross-host Periphery. core.pub only lets
# Periphery trust Core's identity (the noise handshake) — it doesn't
# register this node as a Server in Komodo at all. Live testing confirmed
# an onboarding key is also required for first connect: generate one from
# cellar's Komodo UI (Settings -> the Servers/onboarding section — exact
# location wasn't pinned down further than that by Komodo's own docs,
# komo.do/docs/setup/connect-servers, which only says "Create an
# onboarding key via the Komodo Core API / UI"), matching THIS node's name
# (PERIPHERY_CONNECT_AS below), then put it in
# komodo-periphery/secrets.env.local's PERIPHERY_ONBOARDING_KEY (wired via
# generate-secrets.sh's own prompt_secret call — pasted in, never
# randomly generated, same category as every other cross-node credential
# in this fleet). Per Komodo's own docs the key is "not needed if
# connecting as Server that already exists" — i.e. it's a one-time
# bootstrap credential, safe to leave blank/REPLACE_ME on any node that's
# already showing up as a Server in Komodo's UI, needed again only if that
# Server entry is ever deleted and this node has to re-onboard.
#
# FOUND 2026-09-17, separate bug: first real connection attempt with the
# onboarding key above failed with "Onboarding failed: [Client] Failed to
# initialize handshake: Private key must be 32 characters or less, or
# pkcs8 encoded." This is NOT about the onboarding key's format -- it's
# Periphery's own identity key (PERIPHERY_PRIVATE_KEY), a setting distinct
# from PERIPHERY_ONBOARDING_KEY, and a confirmed upstream bug/quirk
# (moghtech/komodo issue #1425): in Periphery v2+ containers,
# `private_key` in periphery.config.toml is ignored -- ONLY the
# PERIPHERY_PRIVATE_KEY env var controls it -- and when it's left unset
# (as this file did), the container falls back to a broken built-in
# default baked into its own Dockerfile, rather than generating a fresh
# key at a sane path. Periphery then tries to use that broken default as
# its private key during the handshake and fails exactly the way seen
# here. Fixed by setting PERIPHERY_PRIVATE_KEY explicitly below, pointed
# at the same ./keys mount as core.pub -- Periphery generates a real
# ed25519 key there itself on first successful boot (nothing to create by
# hand, unlike core.pub) and reuses it on every restart after that.
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    init: true
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://${CELLAR_LAN_IP}:9120
      PERIPHERY_CONNECT_AS: sieve
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      # One-time bootstrap credential — see this file's header comment.
      # Blank/REPLACE_ME is fine once this node is a registered Server.
      PERIPHERY_ONBOARDING_KEY: ${PERIPHERY_ONBOARDING_KEY}
      # Works around moghtech/komodo issue #1425 -- see this file's own
      # header comment. Periphery generates the actual key file itself at
      # this path on first successful boot; nothing to create by hand.
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      # ./keys/core.pub — copied by hand from cellar (see this file's own
      # header comment). Never checked into git: add `komodo-periphery/keys/`
      # to ../.gitignore before first bring-up, the same way every other
      # node's generated/rendered files are excluded.
      - ./keys:/config/keys
      # The single biggest security consideration in this whole file —
      # same caveat as cellar's own Periphery (see that file's own
      # comment): unrestricted Docker socket access, i.e. root-equivalent
      # control of sieve, for whoever controls cellar's Komodo Core web
      # UI, JWT/webhook secrets, or admin account.
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Must be the IDENTICAL path inside and outside the container — see
      # cellar/komodo/docker-compose.yml's own comment (moghtech/komodo
      # discussions/180).
      - /etc/komodo:/etc/komodo
    restart: unless-stopped
