# sieve: the network node. DNS and DHCP for the house, the Cloudflare tunnel,
# and the alerting that has to keep working when everything else doesn't.

# Bring-up order. Unbound first (Pi-hole's only upstream), Pi-hole before
# anything that needs names, Traefik once there's something to route to.
APPS=(unbound pihole ntfy cloudflared traefik gatus netalertx komodo-periphery scrutiny-collector)

# Bridge network for Traefik and the apps it fronts. The subnet is fixed so
# the firewall rules for host-networked Pi-hole and NetAlertX stay valid.
NETWORK=sieve_edge
NETWORK_SUBNET_KEY=EDGE_SUBNET

# The primary resolver: DNS plus DHCP. render-configs.sh regenerates the
# fleet's DNS records and static leases here before rendering.
RESOLVER=primary
