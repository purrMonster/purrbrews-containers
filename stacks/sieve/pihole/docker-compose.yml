# Pi-hole — the LAN's DNS (ad-blocking, local names) and DHCP server.
#
# Everything Pi-hole needs is declared below as FTLCONF_* variables. They are
# re-applied on every start and shown read-only in the web UI, so the compose file
# stays the source of truth and a rebuilt container comes back identical.
#
# Image: pihole/pihole:2026.07.2 (Pi-hole v6, FTL v6). Checked 2026-09-15.
services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    # Host networking: DHCP needs LAN broadcasts, and DNS should see real client IPs.
    network_mode: host
    # dnsmasq refuses to finish starting without NET_ADMIN, even though port 53
    # looks bound. SYS_NICE lets FTL raise its priority.
    cap_add: [NET_ADMIN, SYS_NICE]
    environment:
      TZ: ${TZ:-Asia/Kolkata}

      # ── DNS ───────────────────────────────────────────────────────────────
      FTLCONF_dns_listeningMode: ALL
      # Unbound on the sieve_dns bridge. It validates DNSSEC, so Pi-hole doesn't.
      FTLCONF_dns_upstreams: ${UNBOUND_IP}#53
      FTLCONF_dns_dnssec: "false"
      FTLCONF_dns_domainNeeded: "true"
      FTLCONF_dns_bogusPriv: "true"
      # Fleet node names (sieve, percolator, …) plus PIHOLE_DNS_EXTRA_HOSTS.
      FTLCONF_dns_hosts: ${PIHOLE_DNS_HOSTS:-}
      FTLCONF_dns_expandHosts: "true"
      # Shared generator supplies address=/ and local=/ for each app on BOTH
      # resolvers, plus filter-AAAA. Local app queries must not escape to public
      # DNS; public fallback resolvers cannot answer these private names.
      FTLCONF_misc_dnsmasq_lines: ${PIHOLE_DNSMASQ_LINES:?run ./setup-secrets.sh}

      # ── DHCP ──────────────────────────────────────────────────────────────
      # Sieve is the LAN's sole DHCP server. Keep this role in Compose so an
      # old .env.local value or persisted UI setting cannot disable it on rebuild.
      # DHCP must remain disabled on both routers and on mochaPot.
      FTLCONF_dhcp_active: "true"
      FTLCONF_dhcp_start: ${PIHOLE_DHCP_START}
      FTLCONF_dhcp_end: ${PIHOLE_DHCP_END}
      FTLCONF_dhcp_router: ${GATEWAY}
      FTLCONF_dhcp_leaseTime: ${PIHOLE_DHCP_LEASE:-7d}
      FTLCONF_dhcp_ipv6: "false"
      FTLCONF_dhcp_rapidCommit: "true"
      # Static leases: every fleet node's cloned MAC, plus PIHOLE_DHCP_EXTRA_HOSTS.
      FTLCONF_dhcp_hosts: ${PIHOLE_DHCP_HOSTS:-}

      # ── NTP ───────────────────────────────────────────────────────────────
      # Pi-hole v6 ships an NTP server and client. The host keeps its own time
      # (systemd-timesyncd), and nothing here should answer on port 123.
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"

      # ── Web UI ────────────────────────────────────────────────────────────
      # Port 8080 on the host; reached as pihole.${DOMAIN} through sieve's Traefik,
      # behind Authelia SSO. Its own password is off, so the firewall
      # (../firewall.sh) must keep 8080 closed to everything but sieve_edge.
      # IPv4-only web listener. This does not disable DNS listeners, router
      # advertisements, or the DNS servers learned by clients over IPv6.
      FTLCONF_webserver_port: 8080o
      FTLCONF_webserver_api_password: ""
    volumes:
      - ${DATA_DIR:?}/pihole/etc-pihole:/etc/pihole
    restart: unless-stopped
