# cloudflared â€” outbound-only Cloudflare Tunnel. The house is behind CGNAT, so
# this is the only way in from the internet; no port is opened anywhere.
#
# Token-based, remotely managed tunnel: public hostnames are set in the Cloudflare
# Zero Trust dashboard, not in a local config file. See README.md for the routes.
#
# Image: cloudflare/cloudflared:2026.10.0. Checked 2026-09-15.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    container_name: cloudflared
    # --metrics exposes /ready on the sieve_edge network for Gatus (not published).
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?run ./setup-secrets.sh}
    networks: [sieve_edge]
    # The same /ready Gatus watches, asked by cloudflared itself (the image has
    # no shell, curl or wget): healthy only with a live connection to Cloudflare.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  sieve_edge:
    external: true
