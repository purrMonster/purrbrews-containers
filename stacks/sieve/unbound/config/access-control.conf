# Who may query Unbound. Merged into klutchell/unbound's default config, whose
# own rules allow 127.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12 and 10.0.0.0/8.
#
# Unbound uses the MOST SPECIFIC matching netblock; statement order does not
# matter. So each rule below must be more specific than the base rule it
# overrides — a broad "0.0.0.0/0 refuse" would lose to the base /16 allow.
#
# The only legitimate client is Pi-hole on the sieve host. Host → container
# traffic on the sieve_dns bridge arrives from the bridge gateway, which is the
# first address of DNS_SUBNET (172.31.53.1 with the default 172.31.53.0/28).
# If you change DNS_SUBNET, change both lines here.
server:
  # IPv4-only LAN: do not attempt recursive queries over IPv6.
  do-ip6: no
  access-control: 172.31.53.0/28 refuse
  access-control: 172.31.53.1/32 allow

  # Belt and braces: the LAN (more specific than the base /16 allow).
  access-control: 192.168.0.0/24 refuse
