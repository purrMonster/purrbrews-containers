# Topic names aren't secret (access is deny-all); they just have to stay put.
NTFY_ALERT_TOPIC     value purrbrews-alerts
NTFY_ADMIN_USER      value barista
# What gets typed into the ntfy app on each phone, so it's kept typeable.
# To change it: set a new value, delete NTFY_ADMIN_HASH, run setup again.
NTFY_ADMIN_PASSWORD  hex 32
NTFY_ADMIN_HASH      hash bcrypt NTFY_ADMIN_PASSWORD
# Gatus publishes with its token; this password is never typed anywhere.
NTFY_GATUS_PASSWORD  hex 64
NTFY_GATUS_HASH      hash bcrypt NTFY_GATUS_PASSWORD
# ntfy tokens are exactly 32 characters: tk_ and 29 more.
GATUS_NTFY_TOKEN     hex 29 tk_
# My own additions, kept across runs. Comma-separated, in ntfy's formats:
#   NTFY_EXTRA_USERS name:bcrypt-hash:role    NTFY_EXTRA_ACCESS name:topic:rw|ro|wo
#   NTFY_EXTRA_TOKENS name:tk_…:label
NTFY_EXTRA_USERS     value
NTFY_EXTRA_ACCESS    value
NTFY_EXTRA_TOKENS    value
NOTE phones: server https://ntfy.<DOMAIN>, user barista, password NTFY_ADMIN_PASSWORD from ntfy/secrets.env.local
