# LiteLLM's settings, one line per key (format: stacks/README.md -> secrets.conf).
# ./setup-secrets.sh asks for both and writes secrets.env.local here (gitignored).

# Which cloud model answers as "default", in LiteLLM's provider/model form
# (for example anthropic/<model id> or openai/<model id>; the provider's own
# model list has the ids).
LLM_UPSTREAM_MODEL    prompt the cloud model LiteLLM passes requests to, as provider/model
# That provider's API key. Billed per request: make a key for this fleet only,
# with a spending limit if the provider has one.
LLM_UPSTREAM_API_KEY  prompt the cloud provider's API key for that model
