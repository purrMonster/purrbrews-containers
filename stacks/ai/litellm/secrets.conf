# LiteLLM's settings, one line per key (format: stacks/README.md -> secrets.conf).
# ./setup-secrets.sh asks for all three and writes secrets.env.local here (gitignored).
#
# The provider is still to be chosen (runbook, 2026-11-17). Until then LiteLLM
# talks to any OpenAI-compatible endpoint: these three settings are all that
# changes when one is picked.

# The endpoint's base URL, up to and including /v1 (OpenAI's own is
# https://api.openai.com/v1; other providers document theirs).
LLM_UPSTREAM_API_BASE prompt the OpenAI-compatible endpoint's base URL, ending in /v1
# The model's id as that endpoint knows it, with no provider prefix.
LLM_UPSTREAM_MODEL    prompt the model id at that endpoint (no provider prefix)
# That endpoint's API key. Billed per request: make a key for this fleet only,
# with a spending limit if the provider has one.
LLM_UPSTREAM_API_KEY  prompt the endpoint's API key
