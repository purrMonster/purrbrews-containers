# Open WebUI: the chat page, in front of LiteLLM on this node
# (stacks/ai/litellm), which passes requests to a cloud model. Until the
# 2026-11 rebuild it talked to the local models on roastery's GPU.
#
# It reaches LiteLLM directly on the proxy network, so there is no login
# between them; LiteLLM takes no key there, and OPENAI_API_KEY only has to be
# non-empty.
#
# Image: a release, by tag and digest. On 2026-10-10 it replaced the
# `main` build pinned on 2026-09-29 (which reported 0.11.3 but wasn't that
# release). It migrates the database on start: prepare.sh holds an existing
# install until OPENWEBUI_UPGRADE_READY is set (docs/image-upgrades.md).
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.0@sha256:1565038903151ced924b5a3226f73f40f16963df4b910441f6391f10144afdaa
    container_name: openwebui
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: not-needed-on-the-proxy-network
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "true"
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR:?}/openwebui:/app/backend/data
    # The way in when Traefik or Authelia is down; the first account made
    # becomes the admin. Never combine this port with trusted-header SSO:
    # anyone on the LAN could send the header.
    ports:
      - "8081:8080"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls.certresolver=cloudflare"
      - "traefik.http.routers.openwebui.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

networks:
  default:
    name: proxy
    external: true
