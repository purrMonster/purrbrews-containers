# immich-machine-learning for percolator's Immich: face recognition and smart
# search. It ran on roastery's GPU until the 2026-11 rebuild; with roastery out
# it runs here on grinder's CPU, so percolator (the busiest node) doesn't. On
# an i5 that is slow but steady: the first pass over the library takes days,
# new uploads minutes.
#
# The tag must match immich-server exactly (stacks/apps/immich). Bump both
# together.
#
# It has no authentication at all ("no security measures whatsoever", in
# Immich's words). The only guard is this app's firewall file, which lets
# percolator, and only percolator, reach 3003.
#
# Image: ghcr.io/immich-app/immich-machine-learning (the plain CPU build;
# digest from the registry, 2026-11-16).
services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      # Model weights: downloaded on first use, safe to delete.
      - ${DATA_DIR:?}/immich-ml/model-cache:/cache
    ports:
      - "3003:3003"
    security_opt: [no-new-privileges:true]
    # No healthcheck here because the image has its own (`python3
    # healthcheck.py`, read from the image config 2026-10-08), so
    # `docker ps` already shows healthy/unhealthy.

networks:
  default:
    name: proxy
    external: true
