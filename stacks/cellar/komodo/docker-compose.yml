# Komodo: container management for the whole fleet. Core and its Mongo run
# here, plus a Periphery agent so Core can manage cellar's own containers.
# Every other node runs its own komodo-periphery that dials in on 9120.
#
# Adapted from Komodo's reference mongo.compose.yaml, with every variable
# spelled out per service instead of an env_file, and none of its default
# credentials (admin/changeme, a_random_secret) left in; setup generates them.
#
# Mongo 5+ needs AVX. cellar has it; if this ever moves, check
# `grep avx /proc/cpuinfo` first, or it dies with "Illegal instruction".
#
# Local login only, no Authelia/OIDC. That was a choice, not a gap: if
# Authelia is down, Komodo is the thing I'll want to reach.
#
# Images: komodo-core / komodo-periphery 2.3.2 (pinned rather than `:2`;
# Core has root on every node, I don't want it changing under me), mongo 7.0.
services:
  mongo:
    image: mongo:7.0
    container_name: komodo-mongo
    labels:
      komodo.skip:   # keeps Komodo's "stop all containers" away from its own database
    command: --quiet --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    volumes:
      - ${DATA_DIR:?}/komodo/mongo-data:/data/db
      - ${DATA_DIR:?}/komodo/mongo-config:/data/configdb
    restart: unless-stopped

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2.3.2
    container_name: komodo-core
    init: true
    depends_on:
      - mongo
    # Published for two reasons: the other nodes' Periphery agents connect
    # here (Docker networks don't span hosts), and it's the way in when
    # Traefik or Authelia is down. firewall limits it to the LAN.
    ports:
      - "9120:9120"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.komodo.rule=Host(`komodo.${DOMAIN}`)"
      - "traefik.http.routers.komodo.entrypoints=websecure"
      - "traefik.http.routers.komodo.tls.certresolver=cloudflare"
      - "traefik.http.routers.komodo.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.komodo.loadbalancer.server.port=9120"
    environment:
      TZ: ${TZ}
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      # Only used to suggest webhook/OAuth URLs in the UI.
      KOMODO_HOST: https://komodo.${DOMAIN}
      KOMODO_TITLE: purrBrews Komodo
      # Core writes its key pair into the shared keys directory on first boot,
      # which is how the local Periphery below trusts it without any copying.
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: barista
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_FIRST_SERVER_NAME: cellar
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_JWT_TTL: 1-day
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
      # Nobody else gets to sign up. Upstream defaults this to false; with
      # root on every node behind this login, open registration is the last
      # thing I want. The admin account above already exists.
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_OIDC_ENABLED: "false"
    volumes:
      - ${DATA_DIR:?}/komodo/keys:/config/keys
      - ${DATA_DIR:?}/komodo/backups:/backups
    restart: unless-stopped

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    init: true
    depends_on:
      - komodo-core
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://komodo-core:9120
      PERIPHERY_CONNECT_AS: cellar
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - ${DATA_DIR:?}/komodo/keys:/config/keys
      # The docker socket is root on this machine for whoever controls Core.
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Same path inside and out, or Periphery can't find what it deployed
      # (moghtech/komodo discussion #180).
      - /etc/komodo:/etc/komodo
    restart: unless-stopped

networks:
  default:
    name: cellar_net
    external: true
