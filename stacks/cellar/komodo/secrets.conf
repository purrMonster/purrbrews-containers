# Komodo's reference compose ships admin/changeme and a_random_secret; none of
# those survive here. Treat the JWT and webhook secrets like a root SSH key:
# Core can run anything on every node that has a Periphery agent.
KOMODO_DATABASE_USERNAME    value komodo
KOMODO_DATABASE_PASSWORD    hex 64
KOMODO_JWT_SECRET           hex 64
KOMODO_WEBHOOK_SECRET       hex 64
KOMODO_INIT_ADMIN_PASSWORD  hex 32
