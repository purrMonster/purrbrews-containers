# cellar: backups, file shares, and the fleet's ops tools (Komodo, the
# Scrutiny hub). Always on, so the backup schedule lives here.

# Bring-up order. Komodo first so the other nodes' Periphery agents have
# something to register with, Scrutiny so their collectors have somewhere
# to report, then Traefik for the two web UIs. restic and NFS aren't
# containers; see their READMEs.
APPS=(komodo scrutiny traefik smb)

# Every container here joins cellar_net. Nothing on cellar needs a fixed
# subnet, so Docker picks one.
NETWORK=cellar_net
