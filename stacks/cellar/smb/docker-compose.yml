# Samba: the household share and the app archive, for browsing from laptops.
# The archive is also exported over NFS (../nfs), host-native.
#
# ghcr.io/servercontainers/samba, because dperson/samba (the one every
# tutorial uses) is unmaintained. The latest channel is pinned by digest;
# shares remain optional and require an explicit access policy before use.
#
# Not reachable yet: ufw-docker keeps 139/445 closed until smb/firewall has a
# rule. UID_barista has to match the NFS export's anonuid (1000) and whatever
# the consuming containers run as, or SMB and NFS will fight over ownership.
services:
  smb:
    image: ghcr.io/servercontainers/samba:latest@sha256:ac7c406702a3bf4137fcd04ce031d87adbda1b819f698fe89a89b5ee46618dfb
    container_name: smb
    environment:
      TZ: ${TZ}
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_ROLE: standalone
      AVAHI_DISABLE: "1"
      SAMBA_VOLUME_CONFIG_household: "[household]; path=/shares/household; valid users = barista; guest ok = no; read only = no; browseable = yes"
      SAMBA_VOLUME_CONFIG_archive: "[archive]; path=/shares/archive; valid users = barista; guest ok = no; read only = no; browseable = yes"
      ACCOUNT_barista: ${SMB_BARISTA_PASSWORD}
      UID_barista: "1000"
    volumes:
      - ${MEDIA_DIR:?}/household:/shares/household
      - ${MEDIA_DIR:?}/archive:/shares/archive
    ports:
      - "139:139"
      - "445:445"
    restart: unless-stopped

networks:
  default:
    name: cellar_net
    external: true
