# Traefik: HTTPS for Komodo and Scrutiny. Every node runs its own, so a
# broken proxy only takes this node's pages down; sign-in is still Authelia
# on percolator (config/dynamic.yml.template).
#
# Both apps keep their own ports published too. That's the way in when
# Authelia or Traefik is down: Komodo still has its own login there,
# Scrutiny has none (see its compose file).
#
# Image: traefik:v3.7.13. v3.2's Docker client was too old for the upgraded
# engine ("client version 1.24 is too old") and the docker provider looped.
services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${DATA_DIR:?}/traefik/acme:/acme
      # Read-only, for the labels on komodo-core and scrutiny.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

networks:
  default:
    name: cellar_net
    external: true
