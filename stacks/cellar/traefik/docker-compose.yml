services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /srv/data/traefik/acme:/acme
      # Needed for the docker provider to read labels off komodo-core and
      # scrutiny at all -- both are bridge-networked (cellar_net), not
      # network_mode: host like grinder's esphome, but the docker provider
      # still reads the socket directly rather than the network.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    # komodo and scrutiny keep their own direct host port published too --
    # the deliberate backdoor, same as every other node's Traefik. Unlike
    # grinder's/mochaPot's apps, Scrutiny has NO native login of its own
    # (see ../scrutiny/docker-compose.yml's own note) -- Komodo does
    # (local admin account). See README "Traefik and the native-login
    # backdoor".

networks:
  default:
    name: cellar_net
    external: true
