# The backup repository's passphrase. It has to outlive every machine, so it
# goes to flask by hand as soon as it exists: a backup whose only key died
# with the machine isn't a backup. Every node needs the same value (their
# restic/secrets.conf asks for it).
RESTIC_PASSWORD             hex 64
# Where cellar's backup jobs report failures: the ntfy topic URL, with
# ?auth=<token> if the topic needs one. Blank means no alerts.
NTFY_URL                    prompt optional ntfy topic URL for backup alerts
# rclone needs its own Google API client; the shared default is what gets
# rate-limited (403 userRateLimitExceeded). Walkthrough in restic/README.md.
RCLONE_DRIVE_CLIENT_ID      prompt rclone Google Drive OAuth client ID (your own project, see restic/README.md)
RCLONE_DRIVE_CLIENT_SECRET  prompt rclone Google Drive OAuth client secret
# rclone crypt's password and salt for the Drive copy (drive-setup.sh). As
# vital as RESTIC_PASSWORD: without both, Drive holds noise.
RCLONE_CRYPT_PASSWORD       hex 64
RCLONE_CRYPT_SALT           hex 64
NOTE copy RESTIC_PASSWORD, RCLONE_CRYPT_PASSWORD and RCLONE_CRYPT_SALT (restic/secrets.env.local) to flask if you haven't yet
