# Scrutiny: SMART disk health for the fleet. This is the hub (web UI,
# collector and InfluxDB in one container). It watches cellar's own two disks
# directly, and every other node's scrutiny-collector posts here.
#
# No login of its own at all. Through Traefik it sits behind Authelia; the
# published port is only as private as the LAN. I've accepted that for a
# page of disk temperatures.
#
# Image: ghcr.io/analogj/scrutiny:v0.9.3-omnibus (GHCR only; the Docker Hub
# copies are third-party mirrors). Not `latest-omnibus`, which upstream calls
# dangerous. Keep the collectors on the same version. Checked 2026-09-16.
services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.9.3-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO   # smartctl on SATA (the HDD)
      - SYS_ADMIN   # smartctl on NVMe
    # The collectors on other nodes post here directly, and it's the way in
    # when Traefik is down. firewall limits it to the LAN.
    ports:
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scrutiny.rule=Host(`scrutiny.${DOMAIN}`)"
      - "traefik.http.routers.scrutiny.entrypoints=websecure"
      - "traefik.http.routers.scrutiny.tls.certresolver=cloudflare"
      - "traefik.http.routers.scrutiny.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.scrutiny.loadbalancer.server.port=8080"
    volumes:
      - ${DATA_DIR:?}/scrutiny/config:/opt/scrutiny/config
      - ${DATA_DIR:?}/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      # NVMe (the OS and restic's cache) and the HDD (the restic repository).
      - ${DISK_DEVICE:?set DISK_DEVICE in .env.local}
      - ${DISK_DEVICE_2:?set DISK_DEVICE_2 in .env.local}
    restart: unless-stopped

networks:
  default:
    name: cellar_net
    external: true
