# Scrutiny collector: runs smartctl on this node's disks every six hours and
# posts the results to the Scrutiny hub on cellar. No UI, nothing to route.
# The same file on every node since the 2026-11 rebuild (it used to be one
# copy per node).
#
# DISK_DEVICE, and DISK_DEVICE_2 on a node with a second disk, come from the
# node's .env.local. Check them with `lsblk -d -o NAME,SIZE,MODEL`; for NVMe
# use the controller (/dev/nvme0), not the namespace (/dev/nvme0n1). A node
# with one disk leaves DISK_DEVICE_2 unset: the second entry then maps
# /dev/null, which every container has anyway.
#
# A disk that needs different smartctl arguments gets its own collector.yaml:
# point SCRUTINY_COLLECTOR_CONFIG at it in .env.local (mochaPot does; the
# default beside this file changes nothing).
#
# Image: ghcr.io/analogj/scrutiny (collector), the same version as the
# hub on cellar (keep them together). Not `latest-collector`: upstream's own
# README calls the floating tags dangerous. Checked 2026-09-16.
services:
  scrutiny-collector:
    image: ghcr.io/analogj/scrutiny:v0.10.0-collector@sha256:372493d3edf473571b806efb5922e8868537af644b3817536695cae05abd4f2c
    container_name: scrutiny-collector
    cap_add:
      - SYS_RAWIO   # smartctl on SATA
      - SYS_ADMIN   # smartctl on NVMe
    environment:
      COLLECTOR_API_ENDPOINT: http://${CELLAR_LAN_IP}:8080
      # Groups this node's disks under its name in the dashboard.
      COLLECTOR_HOST_ID: ${NODE:?NODE comes from /opt/purrbrews/.env}
      COLLECTOR_CRON_SCHEDULE: "0 */6 * * *"
    volumes:
      - /run/udev:/run/udev:ro
      - ${SCRUTINY_COLLECTOR_CONFIG:-./collector.yaml}:/opt/scrutiny/config/collector.yaml:ro
    devices:
      - ${DISK_DEVICE:?set DISK_DEVICE in .env.local}
      - ${DISK_DEVICE_2:-/dev/null}
    restart: unless-stopped
