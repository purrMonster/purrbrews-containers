services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    # network_mode: host is real official guidance, not a common-practice
    # guess -- confirmed on the pre-restructure build via Home Assistant's
    # own Cast integration docs: "When running the Home Assistant
    # Container in Docker, make sure it is running with host network
    # mode... will cause this integration to be unable to discover Cast
    # devices." Same mDNS-multicast-doesn't-cross-bridge-networks
    # reasoning as musicassistant below. Consequence: this container can't
    # join a bridge network or resolve container DNS names -- see
    # postgres-homeassistant below for how its own database is reached
    # instead (127.0.0.1, loopback).
    network_mode: host
    volumes:
      - /srv/data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      # Bluetooth integrations -- from HA's own official compose example,
      # harmless to include even if no Bluetooth adapter is used yet.
      - /run/dbus:/run/dbus:ro
    environment:
      TZ: ${TZ}
    depends_on:
      postgres-homeassistant:
        condition: service_healthy
    restart: unless-stopped
    # Traefik route added 2026-09-16 alongside ../traefik/. loadbalancer.
    # server.url, not .port -- this container is network_mode: host, so it
    # has no container-network IP for the docker provider to auto-discover
    # (a known limitation of host-networked containers, confirmed via
    # Traefik's own docs). Port 8123 stays published directly too -- the
    # backdoor. See README "Traefik and the native-login backdoor".
    # Unquoted, deliberately (2026-09-17) -- matches every other node's label
    # style (see percolator's authelia/nextcloud). Quoting these broke
    # sieve's setup-secrets.sh: its router_labels() regex expects an optional
    # "-" and whitespace directly before "traefik.http.routers.", and a
    # leading '"' doesn't match, so it silently matched zero lines here --
    # no error, just homeassistant.${DOMAIN} never making it into
    # PIHOLE_DNSMASQ_LINES. Root cause of the 2026-09-17 "site not
    # available" report; same bug fixed in musicassistant/ and pihole/'s
    # compose files in this stack.
    labels:
      - traefik.enable=true
      - traefik.http.routers.homeassistant.rule=Host(`homeassistant.${DOMAIN}`)
      - traefik.http.routers.homeassistant.entrypoints=websecure
      - traefik.http.routers.homeassistant.tls.certresolver=cloudflare
      - traefik.http.routers.homeassistant.middlewares=authelia-forwardauth@file
      - traefik.http.services.homeassistant.loadbalancer.server.url=http://${MOCHAPOT_LAN_IP}:8123
    # MOVED HERE 2026-09-16 from percolator (infrastructure.md §4's new
    # placement rules): "Home Assistant lives on mochaPot for blast radius
    # and locality: it shares a failure domain with neither the app tier
    # nor the network tier, the wall dashboard renders locally if
    # percolator is down, and the laptop battery rides out a power cut."
    # A role change, not a lift-and-shift -- the pre-restructure compose
    # file this was adapted from sat behind percolator's Traefik with
    # Authelia OIDC via a HACS custom component. This version got its OWN
    # Traefik added 2026-09-16 (see ../traefik/).
    #
    # OIDC via hass-oidc-auth (github.com/christiaangoossens/hass-oidc-auth),
    # wired up 2026-09-17. HACS-only, no sidecar container -- deploy steps:
    #   1. Install HACS itself first if this instance doesn't have it yet
    #      (HACS is not part of this compose file / not installable via it).
    #   2. HACS -> search "OpenID Connect for Home Assistant" -> install.
    #   3. Authelia's client is in stacks/percolator/authelia/config/
    #      configuration.yml.template (client_id 'homeassistant'). Get the
    #      plaintext secret from percolator:
    #        grep '^HOMEASSISTANT_OIDC_CLIENT_SECRET=' \
    #          /opt/purrbrews/stacks/percolator/authelia/secrets.env.local
    #   4. On mochaPot, /srv/data/homeassistant/secrets.yaml:
    #        oidc_client_secret: <the plaintext from step 3>
    #   5. /srv/data/homeassistant/configuration.yaml:
    #        auth_oidc:
    #          client_id: "homeassistant"
    #          client_secret: !secret oidc_client_secret
    #          discovery_url: "https://authelia.${DOMAIN}/.well-known/openid-configuration"
    #          claims:
    #            username: "preferred_username"
    #            display_name: "name"
    #            groups: "groups"
    #          groups_scope: "groups"
    #      Keep the default `homeassistant` auth provider in http.auth_providers
    #      alongside this -- hass-oidc-auth's own docs say so, and it's the
    #      break-glass login if Authelia is ever down (same reasoning as
    #      Paperless's and Nextcloud's own local-admin break-glass accounts).
    #   6. Restart, then Settings -> Devices & Services (or the login page)
    #      should offer "Log in with Authelia" / "OpenID Connect/SSO".
    #
    # DECISION NEEDED, not yet made: this router already sits behind
    # authelia-forwardauth@file (below), which gates the whole domain at
    # Traefik before Home Assistant's own login page ever loads. Adding
    # hass-oidc-auth on top doesn't conflict -- same Authelia session
    # cookie, so it's normally a no-prompt pass-through -- but it does mean
    # two independent gates protecting the same app. Leaving both is
    # defense-in-depth (HA's login page is never exposed to an
    # unauthenticated request at all); removing the ForwardAuth middleware
    # here would make hass-oidc-auth the only gate, matching how Nextcloud/
    # Paperless are set up (OIDC only, no ForwardAuth in front). Not changed
    # either way as part of this OIDC rollout -- pick one deliberately.
    #
    # Local HA login remains available as the break-glass path either way.
    # Reachable both at
    # https://homeassistant.${DOMAIN} (through Traefik + percolator's
    # Authelia ForwardAuth -- needs mochaPot in FORWARD_AUTH_CLIENTS,
    # done 2026-09-16) and directly at http://${MOCHAPOT_LAN_IP}:8123
    # (the backdoor) -- no default credentials either way, onboarding
    # wizard on first visit.
    #
    # IMPORTANT -- the Postgres recorder is NOT configurable via compose at
    # all. Confirmed on the pre-restructure build via HA's own Recorder
    # integration docs: no env var for this, configuration.yaml-only, and
    # HA does not create the target database itself (already created here
    # by generate-secrets.sh's homeassistant/ block + postgres-homeassistant
    # below). After first boot, add to /srv/data/homeassistant/configuration.yaml:
    #
    #   recorder:
    #     db_url: postgresql://homeassistant:<HA_DB_PASSWORD from
    #       ./secrets.env.local>@127.0.0.1:5432/homeassistant
    #
    # then restart the container. Left as SQLite (HA's own default) until
    # that manual step is done -- functions fine either way, Postgres is a
    # scale/performance upgrade for the recorder specifically, not a hard
    # requirement to get HA running.
    #
    # ANOTHER manual step, needed now that Traefik sits in front of this:
    # Home Assistant refuses requests from a reverse proxy it doesn't
    # explicitly trust -- confirmed via HA's own reverse-proxy docs,
    # symptom is a "Login attempt or request with invalid authentication
    # from a banned/untrusted proxy" error. Add to
    # /srv/data/homeassistant/configuration.yaml:
    #
    #   http:
    #     use_x_forwarded_for: true
    #     trusted_proxies:
    #       - ${PROXY_SUBNET}   # e.g. 172.30.13.0/24, see local.env.example
    #
    # then restart. Same category of gap as the recorder db_url above --
    # config lives on disk, not in compose/env, so it can't be set here.
    #
    # CORRECTED 2026-09-17: originally documented as trusting
    # ${MOCHAPOT_LAN_IP} directly, which is wrong -- Traefik's container is
    # on mochapot_net (a bridge network), not the host, so a request it
    # proxies to Home Assistant's host-networked port gets hairpin-NATed and
    # arrives from Traefik's *container* IP on that bridge, not mochaPot's
    # LAN IP. Confirmed live: HA kept 400ing on the reverse-proxy check even
    # with the LAN IP trusted, until the actual source (Traefik's bridge
    # address) was added. Trust the whole ${PROXY_SUBNET} CIDR instead of a
    # single container IP -- the IP a freshly recreated Traefik container
    # gets is not guaranteed to be the same one twice, the subnet is (see
    # compose.sh, which now pins it on network creation).
    #
    # Recorder retention -- set this BEFORE the sensors arrive
    # (infrastructure.md §9): ESPHome publishes diagnostic entities that
    # update constantly and that nobody ever reads. Also in
    # configuration.yaml:
    #
    #   recorder:
    #     purge_keep_days: 14
    #     exclude:
    #       domains: [automation, updater]
    #       entity_globs: ["sensor.*_uptime", "sensor.*_linkquality"]

  postgres-homeassistant:
    image: postgres:16
    container_name: postgres-homeassistant
    environment:
      POSTGRES_USER: ${HA_DB_USERNAME}
      POSTGRES_PASSWORD: ${HA_DB_PASSWORD}
      POSTGRES_DB: ${HA_DB_DATABASE_NAME}
    volumes:
      - /srv/data/postgres-homeassistant:/var/lib/postgresql/data
    # No networks: block -- homeassistant can't join a bridge network
    # anyway (network_mode: host, see above), and colocating this in the
    # same compose file/project as its only consumer means it doesn't need
    # one either.
    #
    # Published to localhost ONLY -- Home Assistant needs network_mode:
    # host, which means it can't resolve this container by hostname, so it
    # reaches this via 127.0.0.1 instead of a container name.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HA_DB_USERNAME} -d ${HA_DB_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
