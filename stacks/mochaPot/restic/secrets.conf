# The backup repository's passphrase. cellar made it (cellar/restic/secrets.conf);
# every node uses the same one, so paste it from cellar's restic/secrets.env.local.
RESTIC_PASSWORD  prompt restic repository password (copy RESTIC_PASSWORD from cellar: stacks/cellar/restic/secrets.env.local)
# Where a failed nightly backup is reported: the ntfy topic URL, with
# ?auth=<token> on the end if the topic needs it. Blank means no alerts.
NTFY_URL         prompt optional ntfy topic URL for backup alerts
