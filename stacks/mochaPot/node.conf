# mochaPot: home automation, music and the wall screen, plus the secondary
# Pi-hole. The laptop battery rides out a power cut, and the wall dashboard
# still renders if percolator is down, which is why Home Assistant is here.

# Bring-up order. Pi-hole before Traefik: both are on the host's ports and
# Pi-hole's web UI had to move off 80 to make room. The kiosk is host-native
# (kiosk/README.md), so it isn't listed.
APPS=(pihole homeassistant musicassistant traefik komodo-periphery scrutiny-collector)

# Traefik sits on this network; the three apps it fronts are host-networked
# and see its requests coming from this subnet, which Home Assistant has to
# trust (homeassistant/README.md). Hence a fixed subnet.
NETWORK=mochapot_net
NETWORK_SUBNET_KEY=PROXY_SUBNET

# The secondary resolver: DNS only, never DHCP.
RESOLVER=secondary
