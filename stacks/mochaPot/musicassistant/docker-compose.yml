# Music Assistant: whole-house audio. Host networking for mDNS/UPnP player
# discovery and streaming to Cast, AirPlay, Sonos and DLNA; every player has
# to be on the same flat LAN.
#
# No login of its own. Through Traefik it's behind Authelia; the direct port
# (8095) is only as private as the LAN.
#
# Image: ghcr.io/music-assistant/server:2.9.8.
services:
  musicassistant:
    image: ghcr.io/music-assistant/server:2.9.8
    container_name: musicassistant
    network_mode: host
    # Same resolv.conf snapshot problem as Home Assistant.
    dns:
      - ${DNS_PRIMARY:-192.168.0.10}
      - ${DNS_SECONDARY:-192.168.0.13}
    volumes:
      - ${DATA_DIR:?}/musicassistant:/data
    environment:
      TZ: ${TZ}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.musicassistant.rule=Host(`music.${DOMAIN}`)
      - traefik.http.routers.musicassistant.entrypoints=websecure
      - traefik.http.routers.musicassistant.tls.certresolver=cloudflare
      - traefik.http.routers.musicassistant.middlewares=authelia-forwardauth@file
      - traefik.http.services.musicassistant.loadbalancer.server.url=http://${NODE_IP:?}:8095
