# Shared service settings: ../../_shared/scrutiny-collector.yml
# Keep node-local paths and disk devices here.
services:
  scrutiny-collector:
    extends:
      file: ../../_shared/scrutiny-collector.yml
      service: scrutiny-collector
    volumes:
      # Reads this disk without its stuck statistics log (see collector.yaml).
      - ./collector.yaml:/opt/scrutiny/config/collector.yaml:ro
    devices:
      - ${DISK_DEVICE:?set DISK_DEVICE in .env.local}
