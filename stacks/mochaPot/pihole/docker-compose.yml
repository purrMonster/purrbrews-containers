# Pi-hole, secondary: DNS only, never DHCP. It forwards to public resolvers
# rather than to sieve's Unbound, so it keeps working when sieve doesn't,
# and it serves the same generated split DNS (see ../../_lib/dns-records.py).
#
# Image: pihole/pihole:2026.07.2, the same as sieve's. Checked 2026-09-15.
services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    # Host networking so it answers on the LAN's port 53 and sees real clients.
    network_mode: host
    # dnsmasq won't finish configuring without it: FTL says it's listening on
    # 53 and every query times out.
    cap_add:
      - NET_ADMIN
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
      FTLCONF_dns_hosts: ${PIHOLE_DNS_HOSTS:-}
      FTLCONF_dns_expandHosts: "true"
      FTLCONF_misc_dnsmasq_lines: ${PIHOLE_DNSMASQ_LINES:?run ./render-configs.sh}
      # Set in compose so no saved UI setting can ever turn DHCP on here.
      # Two DHCP servers on one LAN is how the house loses its network.
      FTLCONF_dhcp_active: "false"
      FTLCONF_dhcp_ipv6: "false"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"
      # Off 80, which Traefik needs on this host. IPv4 only, like sieve's:
      # the LAN has no IPv6 and the firewall has no v6 rule for it.
      FTLCONF_webserver_port: 8081o
      # A real password, unlike sieve's: the direct port is the way in when
      # Authelia is down, so this login can't be switched off.
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
    volumes:
      - ${DATA_DIR:?}/pihole/etc-pihole:/etc/pihole
    restart: unless-stopped
    # pihole-mochapot, because pihole.${DOMAIN} is sieve's.
    labels:
      - traefik.enable=true
      - traefik.http.routers.pihole-mochapot.rule=Host(`pihole-mochapot.${DOMAIN}`)
      - traefik.http.routers.pihole-mochapot.entrypoints=websecure
      - traefik.http.routers.pihole-mochapot.tls.certresolver=cloudflare
      - traefik.http.routers.pihole-mochapot.middlewares=authelia-forwardauth@file
      - traefik.http.services.pihole-mochapot.loadbalancer.server.url=http://${NODE_IP:?}:8081
