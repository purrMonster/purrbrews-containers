services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    # Host networking, deliberately -- same reasoning as sieve's own
    # Pi-hole: needs to see real LAN traffic for DNS (port 53); no
    # bridge-network alternative works reliably.
    network_mode: host
    # dnsmasq needs this to fully configure itself -- see
    # stacks/sieve/pihole/docker-compose.yml's own comment for the exact
    # symptom (FTL reports "listening on port 53" but every query times
    # out) if this is ever dropped by accident.
    cap_add:
      - NET_ADMIN
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      FTLCONF_dns_listeningMode: "ALL"
      # infrastructure.md §5: "DNS secondary — mochaPot — Pi-hole, DNS
      # only, never DHCP." This instance is completely independent of
      # sieve's -- its own blocklists, its own query log, no
      # replication between them. Same upstream resolver as sieve's for
      # consistency (Cloudflare); change both together if that's ever
      # revisited.
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
      # No Traefik on this node (unlike sieve's copy of this same image,
      # which moves the web UI off 80/443 because Traefik owns those
      # here). Default port is fine -- nothing else on mochaPot binds 80.
      # Admin UI: http://${MOCHAPOT_LAN_IP}/admin
      #
      # Real web password, unlike sieve's (see pihole/secrets.env.local's
      # own comment via generate-secrets.sh) -- this instance has no
      # Authelia ForwardAuth in front of it, so its own login is the only
      # gate it has. FTLCONF_ vars force this every startup (unlike the
      # old WEBPASSWORD var, which only seeded the config once).
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
    volumes:
      - /srv/data/pihole/etc-pihole:/etc/pihole
    restart: unless-stopped
    # Traefik route added 2026-09-16 (../traefik/) fronts the admin UI at
    # pihole-mochapot.${DOMAIN} (not pihole.${DOMAIN} -- that hostname, if
    # it ever exists, belongs to sieve's PRIMARY Pi-hole once that node is
    # migrated into this repo; two apps answering the same hostname on
    # different nodes would be a real conflict, not a style choice).
    # PIHOLE_WEBPASSWORD stays real and required either way (see this
    # file's own comment above) -- both the Traefik path and the direct
    # port at ${MOCHAPOT_LAN_IP} require this instance's own login, DNS
    # (port 53) is never routed through Traefik regardless.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole-mochapot.rule=Host(`pihole-mochapot.${DOMAIN}`)"
      - "traefik.http.routers.pihole-mochapot.entrypoints=websecure"
      - "traefik.http.routers.pihole-mochapot.tls.certresolver=cloudflare"
      - "traefik.http.routers.pihole-mochapot.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.pihole-mochapot.loadbalancer.server.url=http://${MOCHAPOT_LAN_IP}:80"
    # DHCP MUST STAY OFF on this instance. infrastructure.md §5: "Never
    # run two DHCP servers on one LAN... mochaPot's Pi-hole serves DNS
    # only." Do not enable Settings -> DHCP here, ever -- sieve is the
    # fleet's only DHCP server, 7-day lease, by design.
