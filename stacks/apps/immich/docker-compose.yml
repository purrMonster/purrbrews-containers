# Immich — photos and videos. Runs on grinder (moved from percolator, owner
# 2026-11-23). Postgres (with VectorChord) and Valkey are private to this
# project. Machine learning is ../../ai/immich-ml on the same node, reached by
# container name on the proxy network; it must run the same version as
# immich-server.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-valkey
      IMMICH_TRUSTED_PROXIES: ${PROXY_SUBNET}
      # Default for new installs; can be overridden in Administration → Machine Learning.
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      # The relay's CA, added to Node's public roots (not replacing them), so
      # mail to percolator's mail-relay verifies. On grinder the file is a copy
      # of percolator's tls-public/ca.crt (README.md). The SMTP settings
      # themselves are in the admin UI. A missing file only logs a warning.
      NODE_EXTRA_CA_CERTS: /etc/purrbrews/ca.crt
    volumes:
      - ${DATA_DIR}/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR}/mail-relay/tls-public:/etc/purrbrews:ro
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      # grinder's Traefik has no default resolver on websecure (percolator's
      # traefik-ingress did); its own login, so no ForwardAuth in front.
      - traefik.http.routers.immich.tls.certresolver=cloudflare
      - traefik.http.services.immich.loadbalancer.server.port=2283

  postgres:
    # Immich's own image; plain Postgres or pgvector will fail its migrations.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Local disk only — never a network share.
      - ${DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    container_name: immich-valkey
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
