# Backup settings every node has. The repository password is in
# secrets.hub.conf (the hub makes it) or secrets.client.conf (everyone else
# pastes it); secrets.hook picks one from node.conf's BACKUP_HUB.
#
# Where a failed backup is reported: the ntfy topic URL, with ?auth=<token>
# on the end if the topic needs it. Blank means no alerts.
NTFY_URL         prompt optional ntfy topic URL for backup alerts
