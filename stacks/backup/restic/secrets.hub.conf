# The backup hub only (node.conf BACKUP_HUB=true; cellar).
#
# The backup repository's passphrase. It has to outlive every machine, so it
# goes to the offline recovery kit by hand as soon as it exists: a backup
# whose only key died with the machine isn't a backup. Every node needs the
# same value (secrets.client.conf asks for it there).
RESTIC_PASSWORD             hex 64
# rclone needs its own Google API client; the shared default is what gets
# rate-limited (403 userRateLimitExceeded). Walkthrough in README.md.
RCLONE_DRIVE_CLIENT_ID      prompt rclone Google Drive OAuth client ID (your own project, see stacks/backup/restic/README.md)
RCLONE_DRIVE_CLIENT_SECRET  prompt rclone Google Drive OAuth client secret
# rclone crypt's password and salt for the Drive copy (drive-setup.sh). As
# vital as RESTIC_PASSWORD: without both, Drive holds noise.
RCLONE_CRYPT_PASSWORD       hex 64
RCLONE_CRYPT_SALT           hex 64
NOTE copy RESTIC_PASSWORD, RCLONE_CRYPT_PASSWORD and RCLONE_CRYPT_SALT (stacks/backup/restic/secrets.env.local) to the offline recovery kit if you haven't yet
