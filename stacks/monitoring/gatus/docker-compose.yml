# Gatus — health checks for the fleet, alerts to ntfy. Dashboard: gatus.${DOMAIN}
# through sieve's Traefik (no port published).
#
# Lives on sieve, away from the storage and app nodes it watches. Its own
# liveness is watched from outside the house: it pings healthchecks.io every
# 5 minutes, and healthchecks.io alerts when the pings stop.
#
# config/config.yaml is tracked and read as-is; Gatus substitutes ${VARS} from
# this container's environment itself, so no secret is ever rendered to disk.
#
# Image: twinproduction/gatus (the current `stable`).
services:
  gatus:
    image: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    container_name: gatus
    user: ${PUID:?}:${PGID:?}
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      GATUS_CONFIG_PATH: /config/config.yaml
      DOMAIN: ${DOMAIN}
      NODE_IP: ${NODE_IP}
      GATEWAY: ${GATEWAY}
      NTFY_ALERT_TOPIC: ${NTFY_ALERT_TOPIC:?run ./setup-secrets.sh}
      GATUS_NTFY_TOKEN: ${GATUS_NTFY_TOKEN:?run ./setup-secrets.sh}
      NTFY_CRITICAL_TOPIC: ${NTFY_CRITICAL_TOPIC:?run ./setup-secrets.sh}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:?run ./setup-secrets.sh}
      # Which parts of the fleet to watch (config.yaml, top of endpoints):
      # sieve's .env.local sets false for what isn't built yet.
      GATUS_WATCH_PERCOLATOR: ${GATUS_WATCH_PERCOLATOR:-true}
      GATUS_WATCH_CELLAR: ${GATUS_WATCH_CELLAR:-true}
      GATUS_WATCH_MOCHAPOT: ${GATUS_WATCH_MOCHAPOT:-true}
      GATUS_WATCH_GRINDER: ${GATUS_WATCH_GRINDER:-true}
      GATUS_WATCH_TUNNEL: ${GATUS_WATCH_TUNNEL:-true}
      GATUS_WATCH_NETALERTX: ${GATUS_WATCH_NETALERTX:-true}
    volumes:
      - ./config:/config:ro
      - ${DATA_DIR:?}/gatus:/data
    networks: [proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  proxy:
    external: true
