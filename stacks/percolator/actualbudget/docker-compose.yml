# Actual Budget â€” envelope budgeting.
# Image tag checked 2026-09-15.
services:
  actualbudget:
    image: actualbudget/actual-server:26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    container_name: actualbudget
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # Default is "::"; where a container has no IPv6 the server logs
      # "Listening" and then exits 0 (seen 2026-10-08). Same reason as
      # PAPERLESS_BIND_ADDR.
      ACTUAL_HOSTNAME: 0.0.0.0
      # Sign in with Authelia. The FIRST account to sign in becomes the
      # server owner permanently â€” sign in as the intended owner first.
      ACTUAL_OPENID_DISCOVERY_URL: https://authelia.${DOMAIN}
      ACTUAL_OPENID_CLIENT_ID: actual-budget
      ACTUAL_OPENID_CLIENT_SECRET: ${ACTUALBUDGET_OIDC_CLIENT_SECRET}
      ACTUAL_OPENID_SERVER_HOSTNAME: https://actualbudget.${DOMAIN}
      ACTUAL_USER_CREATION_MODE: login
    volumes:
      - ${DATA_DIR}/actualbudget:/data
    # The image's own script: GET /health must say {"status":"UP"}.
    healthcheck:
      test: ["CMD", "node", "/app/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.actualbudget.rule=Host(`actualbudget.${DOMAIN}`)
      - traefik.http.routers.actualbudget.entrypoints=websecure
      - traefik.http.services.actualbudget.loadbalancer.server.port=5006

networks:
  proxy:
    external: true
