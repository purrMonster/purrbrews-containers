# Scrutiny collector: runs smartctl on this node's disks every six hours and
# posts the results to the Scrutiny hub on cellar. No UI, nothing to route.
#
# percolator has two disks: DISK_DEVICE (NVMe, /srv/data) and DISK_DEVICE_2
# (SATA SSD, the OS), both in .env.local. Check them with `lsblk -d -o NAME,SIZE,MODEL`;
# for NVMe use the controller (/dev/nvme0), not the namespace (/dev/nvme0n1).
#
# Image: ghcr.io/analogj/scrutiny (collector), the same version as the
# hub on cellar (keep them together). Not `latest-collector`: upstream's own
# README calls the floating tags dangerous. Checked 2026-09-16.
services:
  scrutiny-collector:
    image: ghcr.io/analogj/scrutiny:v0.9.5-collector@sha256:e55394663d4430af7dec36b1979785a2a2481b317047077eac84acb8305d583d
    container_name: scrutiny-collector
    cap_add:
      - SYS_RAWIO   # smartctl on SATA
      - SYS_ADMIN   # smartctl on NVMe
    environment:
      COLLECTOR_API_ENDPOINT: http://${CELLAR_LAN_IP}:8080
      # Groups this node's disks under its name in the dashboard.
      COLLECTOR_HOST_ID: ${NODE:?NODE comes from /opt/purrbrews/.env}
      COLLECTOR_CRON_SCHEDULE: "0 */6 * * *"
    volumes:
      - /run/udev:/run/udev:ro
    devices:
      - ${DISK_DEVICE:?set DISK_DEVICE in .env.local}
      - ${DISK_DEVICE_2:?set DISK_DEVICE_2 in .env.local}
    restart: unless-stopped
