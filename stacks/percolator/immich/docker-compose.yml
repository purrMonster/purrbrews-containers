# Immich — photos and videos. Postgres (with VectorChord) and Valkey are
# private to this project. Machine learning runs on roastery (IMMICH_ML_URL).
# Image tags checked 2026-09-15. immich-machine-learning on roastery must run
# the same version as immich-server.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.1
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-valkey
      IMMICH_TRUSTED_PROXIES: ${PROXY_SUBNET}
      # Default for new installs; can be overridden in Administration → Machine Learning.
      IMMICH_MACHINE_LEARNING_URL: ${IMMICH_ML_URL}
    volumes:
      - ${DATA_DIR}/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.services.immich.loadbalancer.server.port=2283

  postgres:
    # Immich's own image; plain Postgres or pgvector will fail its migrations.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Local disk only — never a network share.
      - ${DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.2-alpine
    container_name: immich-valkey
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
