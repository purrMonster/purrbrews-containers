# Komodo Periphery — standalone agent added 2026-09-16, same pattern as
# stacks/sieve/komodo-periphery/docker-compose.yml (see that file's own
# header comment for the full explanation of why this differs from
# cellar's own same-host Periphery, including the CONFIRMED 2026-09-17
# note on why PERIPHERY_ONBOARDING_KEY (below) is required for first
# connect, not just core.pub. percolator's copy differs only in
# PERIPHERY_CONNECT_AS below.
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    init: true
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://${CELLAR_LAN_IP}:9120
      PERIPHERY_CONNECT_AS: percolator
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      # One-time bootstrap credential — see sieve's komodo-periphery/
      # docker-compose.yml header comment. Blank/REPLACE_ME is fine once
      # this node is a registered Server in Komodo.
      PERIPHERY_ONBOARDING_KEY: ${PERIPHERY_ONBOARDING_KEY}
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - ./keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
    restart: unless-stopped
