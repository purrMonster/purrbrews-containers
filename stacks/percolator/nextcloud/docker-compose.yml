# Nextcloud â€” files, calendars, contacts. Postgres and Valkey are private to
# this project; only the web container joins `proxy`.
# Image tags checked 2026-09-15.
services:
  nextcloud:
    image: nextcloud:35.0.1-apache@sha256:f4e0ee28ac9e54cad6e04e148489d79a609acba86dfbff69c8f666d50f96e414
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment: &nextcloud-env
      TZ: ${TZ}
      # First start only: creates the admin account and installs.
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.${DOMAIN}
      POSTGRES_HOST: nextcloud-postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-valkey
      REDIS_HOST_PORT: "6379"
      # Behind Traefik: without these, logins bounce in a redirect loop.
      TRUSTED_PROXIES: ${PROXY_SUBNET}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: nextcloud.${DOMAIN}
      OVERWRITECLIURL: https://nextcloud.${DOMAIN}
      PHP_UPLOAD_LIMIT: 16G
      PHP_MEMORY_LIMIT: 1G
      APACHE_BODY_LIMIT: "0"
    volumes:
      - ${DATA_DIR}/nextcloud/html:/var/www/html
    # status.php answers on localhost whatever the trusted domains say, and
    # with 200 even in maintenance mode (upgrades), so it reads the JSON:
    # healthy only when installed and not in maintenance. $$ is compose's
    # escape for a literal $. The long start period covers an upgrade, which
    # runs before Apache starts.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 10 http://localhost/status.php | php -r '$$s = json_decode(stream_get_contents(STDIN), true); exit(!empty($$s[\"installed\"]) && empty($$s[\"maintenance\"]) ? 0 : 1);'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 5m
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.middlewares=nextcloud-hsts,nextcloud-dav
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
      # Phones and DAV clients look for these well-known URLs.
      - traefik.http.middlewares.nextcloud-dav.redirectregex.permanent=true
      - traefik.http.middlewares.nextcloud-dav.redirectregex.regex=^https://(.*)/.well-known/(?:card|cal)dav
      - traefik.http.middlewares.nextcloud-dav.redirectregex.replacement=https://$${1}/remote.php/dav/
      # HSTS, which Administration â†’ Overview kept flagging. It lives here and
      # not in .htaccess: Apache only ever sees plain HTTP from Traefik, and
      # upgrades regenerate .htaccess anyway. 180 days is the least Nextcloud's
      # check accepts.
      - traefik.http.middlewares.nextcloud-hsts.headers.stsSeconds=15552000
      - traefik.http.middlewares.nextcloud-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.nextcloud-hsts.headers.forceSTSHeader=true

  # Background jobs every 5 minutes (set Administration â†’ Basic settings â†’
  # Background jobs to "Cron").
  cron:
    image: nextcloud:35.0.1-apache@sha256:f4e0ee28ac9e54cad6e04e148489d79a609acba86dfbff69c8f666d50f96e414
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - nextcloud
    environment: *nextcloud-env
    volumes:
      - ${DATA_DIR}/nextcloud/html:/var/www/html
    networks:
      - default

  postgres:
    # Nextcloud supports PostgreSQL up to 17.
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: nextcloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - ${DATA_DIR}/nextcloud/postgres:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: nextcloud-valkey
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
