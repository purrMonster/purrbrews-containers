# meowGram: the household's cat-lounge chat (own repo, purrMonster/meowGram).
# Moved here from roastery (2026-10-14): a workstation that sleeps and games is
# the wrong home for the chat, and here its database is dumped nightly like
# every other app's.
#
# Images are the ones meowGram's release workflow builds from a version tag and
# pushes to GHCR, so what runs is still built from that repo's Git, pinned by
# tag and digest like everything else here (Dependabot proposes new releases).
# Both are domain-free: the web app finds the backend on its own origin and
# reads the sign-in settings from GET /api/client-config.
#
# No ForwardAuth: the phone and desktop apps can't follow that redirect. The app
# runs the Authelia OIDC login itself (public client `meowgram`, PKCE), and the
# backend checks every request's JWT against Authelia's /jwks.json.
# Nothing is published: Traefik is the only way in (meowGram's AGENTS.md), and
# Postgres sits on this project's private network only.
# Image tags checked 2026-10-23 (2.0.0, R2).
services:
  server:
    image: ghcr.io/purrmonster/meowgram-server:2.0.0@sha256:cca1dab2a7e54f8274cbf28d14a2632aab8cfa9aaa59ac1287b591373eae9010
    container_name: meowgram-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      APP_DOMAIN: meow.${DOMAIN}
      ENVIRONMENT: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      USE_SECURE_SCHEMES: "true"
      DATABASE_URL: postgres://meowgram:${MEOWGRAM_DB_PASSWORD}@meowgram-postgres:5432/meowgram?sslmode=disable
      # Fetched through percolator's own Traefik (Pi-hole answers with this
      # node's address), the same way Mealie and Paperless find Authelia.
      AUTHELIA_ISSUER: https://authelia.${DOMAIN}
      AUTHELIA_JWKS_URL: https://authelia.${DOMAIN}/jwks.json
      AUTHELIA_CLIENT_ID: meowgram
      # Strict: the only `aud` accepted. Authelia grants it to the meowgram
      # client (authelia/config/configuration.yml.template), so tokens meant
      # for any other app are refused.
      AUTHELIA_AUDIENCE: https://meow.${DOMAIN}
      CORS_ORIGINS: https://meow.${DOMAIN}
      # Push: a Firebase service account at ${DATA_DIR}/meowgram/secrets/
      # (README). Empty means push is off; chat works without it.
      GOOGLE_APPLICATION_CREDENTIALS: ${MEOWGRAM_FCM_CREDENTIALS}
      # 2.0.0 (R2) adds bot accounts that sign in with HTTP Basic against
      # LLDAP, and POST /api/messages for them. Off until the pourOver pilot is
      # approved on its own: it needs an LLDAP reader and a bot group, which
      # are auth changes (meowGram docs/releases/release-2/rollout.md). With it
      # off, people sign in exactly as before.
      BOT_BASIC_AUTH_ENABLED: "false"
    volumes:
      - ${DATA_DIR}/meowgram/secrets:/run/secrets:ro
    # The image's own check, spelled out. 127.0.0.1, not localhost: busybox
    # wget tries ::1 only (runbook, 2026-10-13).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      # /api, /ws and /healthz go to the backend; everything else on the host
      # is the web app (router below). Priority decides, not rule length.
      - traefik.http.routers.meowgram-server.rule=Host(`meow.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/healthz`))
      - traefik.http.routers.meowgram-server.entrypoints=websecure
      - traefik.http.routers.meowgram-server.priority=100
      - traefik.http.routers.meowgram-server.service=meowgram-server
      - traefik.http.services.meowgram-server.loadbalancer.server.port=8080
      - traefik.docker.network=proxy

  web:
    image: ghcr.io/purrmonster/meowgram-web:2.0.0@sha256:fef3726e421410225266539f0242ab777ecdd4374f2f697776571bf3d1125251
    container_name: meowgram-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.meowgram-web.rule=Host(`meow.${DOMAIN}`)
      - traefik.http.routers.meowgram-web.entrypoints=websecure
      - traefik.http.routers.meowgram-web.priority=1
      - traefik.http.routers.meowgram-web.service=meowgram-web
      - traefik.http.services.meowgram-web.loadbalancer.server.port=8080

  postgres:
    # Same pin as Paperless's. A fresh database: nothing is carried over from
    # roastery (runbook, Oct 2026 reset). The server runs its migrations at start.
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: meowgram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meowgram
      POSTGRES_USER: meowgram
      POSTGRES_PASSWORD: ${MEOWGRAM_DB_PASSWORD}
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory: mount the parent.
      - ${DATA_DIR}/meowgram/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meowgram -d meowgram"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

networks:
  proxy:
    external: true
