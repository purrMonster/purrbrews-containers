# Vikunja — shared to-do lists and projects. SQLite on local disk.
# Image tag checked 2026-09-15.
services:
  vikunja:
    image: vikunja/vikunja:2.7.0@sha256:e2204a1c1c6a81e833c2b3a5442be182ca2335b54c2e7e37578cc3fe12a27cfc
    container_name: vikunja
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      VIKUNJA_SERVICE_PUBLICURL: https://vikunja.${DOMAIN}/
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
      VIKUNJA_SERVICE_TIMEZONE: ${TZ}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      # The provider itself is declared in config/config.yml; its secret
      # comes from here so the rendered file holds no secrets.
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_CLIENTSECRET: ${VIKUNJA_OIDC_CLIENT_SECRET}
      # Mail (reminders, overdue digests, password resets) through the fleet's
      # relay. With no username Vikunja sends no credentials; it takes STARTTLS
      # when offered (the relay insists) and verifies against the system roots:
      # SSL_CERT_FILE is the host's public roots plus the relay's CA
      # (mail-relay/prepare.sh), and Go uses it for the OIDC login too.
      # Vikunja adds the display name itself ("Vikunja <...>").
      VIKUNJA_MAILER_ENABLED: "true"
      VIKUNJA_MAILER_HOST: mail-relay
      VIKUNJA_MAILER_PORT: "587"
      VIKUNJA_MAILER_FROMEMAIL: purrBrews@${DOMAIN}
      SSL_CERT_FILE: /etc/purrbrews/bundle.crt
    volumes:
      - ./config/config.yml:/etc/vikunja/config.yml:ro
      - ${DATA_DIR}/vikunja/db:/db
      - ${DATA_DIR}/vikunja/files:/app/vikunja/files
      - ${DATA_DIR}/mail-relay/tls-public:/etc/purrbrews:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.vikunja.rule=Host(`vikunja.${DOMAIN}`)
      - traefik.http.routers.vikunja.entrypoints=websecure
      - traefik.http.services.vikunja.loadbalancer.server.port=3456

networks:
  proxy:
    external: true
