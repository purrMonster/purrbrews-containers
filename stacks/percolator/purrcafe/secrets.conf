# purrCafe. Only the encryption key is made here; the rest are optional and
# each leaves its panel showing "set up" until it's filled in.
CAFE_APP_ENCRYPTION_KEY           hex 64
NOTE copy CAFE_APP_ENCRYPTION_KEY (purrcafe/secrets.env.local) to flask: without it, saved mailboxes can't be read
CAFE_HA_TOKEN                     prompt optional long-lived token of a NON-admin Home Assistant user for the dashboard (blank = home panel stays off)
CAFE_ACTUAL_SYNC_ID               prompt optional Actual Sync ID (Actual -> Settings -> Show advanced settings) (blank = budget panel stays off)
CAFE_ACTUAL_SESSION_TOKEN         prompt optional Actual session token: X-ACTUAL-TOKEN header of a /sync/ request, signed in as the budget's owner (blank = budget panel stays off)
CAFE_ACTUAL_ENCRYPTION_PASSWORD   prompt optional the budget file's end-to-end encryption password, only if that file uses one
CAFE_GATUS_USER                   prompt optional LLDAP service account in perch_api_group for Gatus's API (blank = fleet panel stays off)
CAFE_GATUS_PASSWORD               prompt optional that service account's password
