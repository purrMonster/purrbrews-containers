# Standalone DAV, independent of OpenCloud. Checked 2026-10-12: 3.8.3 fixes
# LDAP group sharing; this image's tagged Dockerfile includes ldap3 and curl.
# Run as the ops uid so the mode-0600 rendered reader secret stays private.
services:
  radicale:
    image: tomsquest/docker-radicale:386.3.0.6.3@sha256:97f7ae15ea15feca8bd430ebd4594c450f38ec1ea5a7582f756826c21f0f0459
    container_name: radicale
    user: ${PUID}:${PGID}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      TAKE_FILE_OWNERSHIP: "false"
    volumes:
      - ./config/config:/config/config:ro
      - ./config/ldap-password:/run/secrets/ldap-password:ro
      # Mount the parent, not just collections: the image's own /data is
      # radicale(2999) mode 770, which uid ${PUID} can't traverse.
      - ${DATA_DIR}/radicale:/data
    healthcheck:
      # GET / redirects to /.web without credentials; curl fails on 4xx/5xx.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:5232/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.radicale.rule=Host(`radicale.${DOMAIN}`)
      - traefik.http.routers.radicale.entrypoints=websecure
      # Basic auth goes directly to Radicale; no browser ForwardAuth.
      # Radicale itself redirects both /.well-known/{caldav,carddav} to /.
      - traefik.http.services.radicale.loadbalancer.server.port=5232

networks:
  proxy:
    external: true
