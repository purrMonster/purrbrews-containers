# Authelia binds to LLDAP as its admin.
AUTHELIA_LDAP_PASSWORD              copy lldap LLDAP_ADMIN_PASSWORD
AUTHELIA_SESSION_SECRET             hex 64
AUTHELIA_STORAGE_ENCRYPTION_KEY     hex 64
AUTHELIA_RESET_PASSWORD_JWT_SECRET  hex 64
AUTHELIA_OIDC_HMAC_SECRET           hex 64
AUTHELIA_REDIS_PASSWORD             hex 64
AUTHELIA_OIDC_JWK_PRIVATE_KEY       rsa 2048

# One hash per OIDC client. The plaintext belongs to the app (its own
# secrets.conf); Authelia only ever sees the hash.
VAULTWARDEN_OIDC_CLIENT_SECRET_HASH   hash pbkdf2 vaultwarden:VAULTWARDEN_OIDC_CLIENT_SECRET
NEXTCLOUD_OIDC_CLIENT_SECRET_HASH     hash pbkdf2 nextcloud:NEXTCLOUD_OIDC_CLIENT_SECRET
IMMICH_OIDC_CLIENT_SECRET_HASH        hash pbkdf2 immich:IMMICH_OIDC_CLIENT_SECRET
PAPERLESS_OIDC_CLIENT_SECRET_HASH     hash pbkdf2 paperless:PAPERLESS_OIDC_CLIENT_SECRET
MEALIE_OIDC_CLIENT_SECRET_HASH        hash pbkdf2 mealie:MEALIE_OIDC_CLIENT_SECRET
VIKUNJA_OIDC_CLIENT_SECRET_HASH       hash pbkdf2 vikunja:VIKUNJA_OIDC_CLIENT_SECRET
ACTUALBUDGET_OIDC_CLIENT_SECRET_HASH  hash pbkdf2 actualbudget:ACTUALBUDGET_OIDC_CLIENT_SECRET
FRESHRSS_OIDC_CLIENT_SECRET_HASH      hash pbkdf2 freshrss:FRESHRSS_OIDC_CLIENT_SECRET

# Home Assistant is on mochaPot and reads its secret from its own
# secrets.yaml, so both halves live here and the plaintext is copied across
# by hand: grep '^HOMEASSISTANT_OIDC_CLIENT_SECRET=' authelia/secrets.env.local
HOMEASSISTANT_OIDC_CLIENT_SECRET       hex 64
HOMEASSISTANT_OIDC_CLIENT_SECRET_HASH  hash pbkdf2 HOMEASSISTANT_OIDC_CLIENT_SECRET

NOTE rotating an OIDC secret: delete <APP>_OIDC_CLIENT_SECRET and its _HASH, run setup, recreate authelia and the app
