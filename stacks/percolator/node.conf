# percolator: ingress, identity and the household's daily apps. Everything a
# person opens in a browser lives here, behind one Traefik and one sign-in.

# Bring-up order; each app only depends on the ones before it. Traefik and
# CrowdSec first, then the directory and the login, then the apps.
APPS=(traefik crowdsec mail-relay lldap authelia radicale opencloud vaultwarden immich paperless mealie vikunja meowgram actualbudget freshrss homepage purrcafe komodo-periphery scrutiny-collector)

# Traefik and every app's web container share this network. The subnet is
# fixed because half the apps list it as their trusted proxy.
NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET
