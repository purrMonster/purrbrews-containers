# grinder: automation, AI indexing and the self-tracking apps. Nothing here is
# household-critical, which is the point: it's cheap to shed, so its free
# memory is where things land when another node dies.

# Bring-up order. The database and the embedding worker before n8n, which
# calls both; the rest don't depend on each other. pourover is optional
# (fleet.json): it only comes up when asked for.
APPS=(postgres-vector embedding-worker n8n openwebui karakeep fittrackee traccar esphome speedtest-tracker pourover traefik komodo-periphery scrutiny-collector)

# Everything joins grinder_net except ESPHome (host network). No fixed
# subnet: firewall.sh asks Docker for it when it needs it.
NETWORK=grinder_net
