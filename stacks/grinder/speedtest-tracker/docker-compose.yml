# Speedtest Tracker: an ISP speed test every hour.
#
# LinuxServer's build; the project's own GHCR image went stale. Tests only
# run if SPEEDTEST_SCHEDULE is set and picked up, and when it isn't there's
# no error, just silence. Check the logs show a run.
#
# Image: lscr.io/linuxserver/speedtest-tracker:v1.15.0-ls170.
services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:v1.15.0-ls170
    container_name: speedtest-tracker
    environment:
      TZ: ${TZ}
      APP_TIMEZONE: ${TZ}
      APP_URL: http://${NODE_IP:?}:8765
      DB_CONNECTION: sqlite
      APP_KEY: ${SPEEDTEST_TRACKER_APP_KEY}
      # Replaces the image's built-in admin@example.com / password.
      ADMIN_NAME: barista
      ADMIN_EMAIL: admin@grinder.local
      ADMIN_PASSWORD: ${SPEEDTEST_TRACKER_ADMIN_PASSWORD}
      SPEEDTEST_SCHEDULE: "0 * * * *"
      # PUBLIC_DASHBOARD stays unset, i.e. off.
    ports:
      - "8765:80"
    volumes:
      - ${DATA_DIR:?}/speedtest-tracker/config:/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.speedtest.rule=Host(`speedtest.${DOMAIN}`)"
      - "traefik.http.routers.speedtest.entrypoints=websecure"
      - "traefik.http.routers.speedtest.tls.certresolver=cloudflare"
      - "traefik.http.routers.speedtest.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.speedtest.loadbalancer.server.port=80"

networks:
  default:
    name: grinder_net
    external: true
