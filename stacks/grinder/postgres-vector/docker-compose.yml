# Postgres with pgvector: the vector store n8n and the embedding worker use.
# Not published; reached as postgres-vector:5432 on grinder_net.
#
# Image: pgvector/pgvector:0.8.7-pg16, the official extension on the official
# image. pg16 like the other Postgres instances on the small nodes.
services:
  postgres-vector:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: postgres-vector
    environment:
      POSTGRES_USER: ${PGVECTOR_USERNAME}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DATABASE_NAME}
    volumes:
      - ${DATA_DIR:?}/postgres-vector:/var/lib/postgresql/data
      # Runs once, on an empty data directory, so nothing else has to create
      # the extension.
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USERNAME} -d ${PGVECTOR_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  default:
    name: grinder_net
    external: true
