# Traccar: live position of the bike, from Traccar Client on the phone. Home
# Assistant's Traccar integration turns it into a device_tracker.
#
# On its bundled H2 database, not Postgres like FitTrackee: constant GPS pings
# are high-write, low-value rows, not worth a database and a backup of their
# own. Revisit if that changes.
#
# The default login is admin/admin and can't be set from here. Change it on
# the first visit.
#
# Image: traccar/traccar:6.2-alpine.
services:
  traccar:
    image: traccar/traccar:6.2-alpine
    container_name: traccar
    ports:
      - "8082:8082"   # web UI
      - "5055:5055"   # OsmAnd protocol, what the phone posts to; not HTTP, so no Traefik
    volumes:
      - ${DATA_DIR:?}/traccar/data:/opt/traccar/data
      - ${DATA_DIR:?}/traccar/logs:/opt/traccar/logs
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traccar.rule=Host(`traccar.${DOMAIN}`)"
      - "traefik.http.routers.traccar.entrypoints=websecure"
      - "traefik.http.routers.traccar.tls.certresolver=cloudflare"
      - "traefik.http.routers.traccar.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.traccar.loadbalancer.server.port=8082"

networks:
  default:
    name: grinder_net
    external: true
