# The embedding worker: a small FastAPI wrapper around sentence-transformers,
# built here (see Dockerfile). n8n calls http://embedding-worker:8000/embed on
# grinder_net; nothing is published.
#
# Built locally, so nothing watches its dependencies for updates. Rebuild it
# now and then: ./compose.sh embedding-worker build --no-cache
services:
  embedding-worker:
    build:
      context: .
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    image: purrbrews/embedding-worker:local
    container_name: embedding-worker
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    # /health only answers once the model has loaded (app.py loads it before
    # serving). python, because the slim image has no curl or wget.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  default:
    name: grinder_net
    external: true
