# ESPHome: the dashboard for the ESP32 sensors. Device YAML lives under
# DATA_DIR, not in git: it holds Wi-Fi credentials and API keys.
#
# Host networking, which ESPHome's docs require for mDNS discovery and
# reliable OTA updates.
#
# Put the sensors on the dedicated 2.4 GHz WPA2 SSID before the first one goes
# live. ESP32s handle band steering and WPA3/mixed mode badly, and
# intermittently, which is worse than failing outright.
#
# Image: ghcr.io/esphome/esphome:stable.
services:
  esphome:
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    network_mode: host
    environment:
      TZ: ${TZ}
      USERNAME: barista
      PASSWORD: ${ESPHOME_DASHBOARD_PASSWORD}
    volumes:
      - ${DATA_DIR:?}/esphome:/config
    restart: unless-stopped
    # Host-networked: Traefik gets the URL, there's nothing to discover.
    # The dashboard on :6052 keeps its basic auth either way.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.esphome.rule=Host(`esphome.${DOMAIN}`)"
      - "traefik.http.routers.esphome.entrypoints=websecure"
      - "traefik.http.routers.esphome.tls.certresolver=cloudflare"
      - "traefik.http.routers.esphome.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.esphome.loadbalancer.server.url=http://${NODE_IP:?}:6052"
