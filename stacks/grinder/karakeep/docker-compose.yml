# Karakeep (was Hoarder): bookmarks and read-it-later. Three services, as in
# upstream's own compose: the app, a headless Chrome for screenshots and
# archiving, and Meilisearch for full-text search.
#
# Image: ghcr.io/karakeep-app/karakeep by tag and digest (first pinned
# 2026-09-29 to the `release` that was running). Meilisearch is the version
# upstream's compose pins for the Karakeep release we run, not the newest:
# Karakeep is only tested against that one. A new Meilisearch can't open an old
# index; prepare.sh holds an existing one until KARAKEEP_SEARCH_UPGRADE_READY
# is set (docs/image-upgrades.md).
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.34.0@sha256:151cdd6b5f2e21635645983e126f411675bfa35becb02c028c1a727f45f899c6
    container_name: karakeep
    environment:
      TZ: ${TZ}
      MEILI_ADDR: http://meilisearch:7700
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET}
      # The direct-port URL, while the route is karakeep.${DOMAIN}. Check the
      # phone share sheet signs in through the hostname before relying on it.
      NEXTAUTH_URL: http://${NODE_IP:?}:3030
      # Flip to false for the very first account, then straight back.
      DISABLE_SIGNUPS: "true"
    volumes:
      - ${DATA_DIR:?}/karakeep:/data
    ports:
      - "3030:3000"
    # Waits for both to answer, not just to exist: screenshots and search
    # quietly fail for anything saved before they're up.
    depends_on:
      meilisearch:
        condition: service_healthy
      chrome:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.karakeep.rule=Host(`karakeep.${DOMAIN}`)"
      - "traefik.http.routers.karakeep.entrypoints=websecure"
      - "traefik.http.routers.karakeep.tls.certresolver=cloudflare"
      - "traefik.http.routers.karakeep.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.karakeep.loadbalancer.server.port=3000"

  chrome:
    # Upstream's maintained browser replaces the retired Chrome 124 image.
    image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa
    container_name: karakeep-chrome
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    # The upstream entrypoint owns ports 9222/9223. Bash is in its base image;
    # checking an HTTP response avoids depending on curl/wget being installed.
    # HTTP/1.1, not 1.0: Chrome's DevTools server rejects 1.0 ("Cannot handle
    # request with protocol: HTTP/1.0", 2026-10-13), which kept karakeep at
    # Created. Connection: close so the reply ends.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r response <&3 && [[ $$response == *' 200 '* ]]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    container_name: karakeep-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
    volumes:
      - ${DATA_DIR:?}/karakeep-meilisearch:/meili_data
    # /health needs no key: {"status":"available"}.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://localhost:7700/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: grinder_net
    external: true
