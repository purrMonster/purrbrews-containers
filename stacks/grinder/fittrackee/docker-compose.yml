# FitTrackee: activity tracking for the bike computer. GPX from the phone
# lands in Nextcloud, n8n picks it up and posts it here. Its own Postgres,
# because every app on this fleet gets its own database.
#
# Image: fittrackee/fittrackee:v1.3.5, the tag upstream's compose pins. Not
# `latest`: the image ships no default command (see below), so an untested
# bump is exactly how this would break again.
services:
  fittrackee:
    image: fittrackee/fittrackee:v1.3.5
    container_name: fittrackee
    environment:
      TZ: ${TZ}
      APP_SECRET_KEY: ${FITTRACKEE_SECRET_KEY}
      DATABASE_URL: postgresql://${FITTRACKEE_DB_USERNAME}:${FITTRACKEE_DB_PASSWORD}@postgres-fittrackee:5432/${FITTRACKEE_DB_DATABASE_NAME}
      UI_URL: http://${NODE_IP:?}:5001
    volumes:
      - ${DATA_DIR:?}/fittrackee/uploads:/usr/src/app/uploads
    # The entrypoint is tini, and the image gives tini nothing to run. Without
    # this, the logs are just tini's usage text and nothing starts.
    command: 'sh docker-entrypoint.sh'
    ports:
      - "5001:5000"
    depends_on:
      postgres-fittrackee:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fittrackee.rule=Host(`fittrackee.${DOMAIN}`)"
      - "traefik.http.routers.fittrackee.entrypoints=websecure"
      - "traefik.http.routers.fittrackee.tls.certresolver=cloudflare"
      - "traefik.http.routers.fittrackee.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.fittrackee.loadbalancer.server.port=5000"

  postgres-fittrackee:
    # FitTrackee 1.x stores GPS tracks as PostGIS geometry, so plain postgres:16
    # fails its first migration ("type geometry does not exist") and the app
    # restarts forever. Same major as before, so the data directory carries over.
    # The image creates the extension only on a fresh data directory; an existing
    # one needs `CREATE EXTENSION postgis` once (runbook, 2026-09-26).
    image: postgis/postgis:16-3.5  # checked 2026-09-26
    container_name: postgres-fittrackee
    environment:
      POSTGRES_USER: ${FITTRACKEE_DB_USERNAME}
      POSTGRES_PASSWORD: ${FITTRACKEE_DB_PASSWORD}
      POSTGRES_DB: ${FITTRACKEE_DB_DATABASE_NAME}
    volumes:
      - ${DATA_DIR:?}/postgres-fittrackee:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FITTRACKEE_DB_USERNAME} -d ${FITTRACKEE_DB_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  default:
    name: grinder_net
    external: true
