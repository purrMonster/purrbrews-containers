# pourOver's settings, one line per key (format: stacks/README.md -> secrets.conf).
# ./setup-secrets.sh asks for the prompts, makes the hex value, and writes secrets.env.local
# here (gitignored). A value is never typed anywhere else: not in this file, not in a chat.
# What each one is and where it comes from: ./README.md -> Before the first up.
#
# URLs holding the domain are built in docker-compose.yml from DOMAIN (a `value` line can't
# expand it): VIKUNJA_URL, LLM_URL, NTFY_URL.

# ── pourOver itself ─────────────────────────────────────────────────────────
POUROVER_INBOUND_TOKEN            hex 64
POUROVER_QUEUE_EXPIRY_HOURS       value 6

# ── the model: llama-swap on roastery, behind Authelia ──────────────────────
POUROVER_LLM_MODEL                value gemma-4-12b
POUROVER_LLM_TIMEOUT_S            value 60
POUROVER_LLM_USER                 prompt the LLDAP service account pourOver signs in to the LLM as (member of ollama_api_group only)
POUROVER_LLM_PASSWORD             prompt that service account's password

# ── the two people (rendered into config/users.yaml) ────────────────────────
POUROVER_USER_A_NAME              prompt person A: the name people use for them in messages
POUROVER_USER_A_MEOWGRAM          prompt person A: their meowGram username
POUROVER_USER_A_VIKUNJA_ID        prompt person A: their Vikunja user id (a number; Vikunja API /api/v2/user)
POUROVER_USER_A_VIKUNJA_TOKEN     prompt person A: a Vikunja API token made by them (Settings -> API tokens; tasks, projects, labels)
POUROVER_USER_A_NTFY_TOPIC        prompt optional person A: their ntfy topic for queued results and errors (blank = none)
POUROVER_USER_A_NTFY_TOKEN        prompt optional person A: an ntfy token that may write that topic (blank = none)
POUROVER_USER_B_NAME              prompt person B: the name people use for them in messages
POUROVER_USER_B_MEOWGRAM          prompt person B: their meowGram username
POUROVER_USER_B_VIKUNJA_ID        prompt person B: their Vikunja user id (a number)
POUROVER_USER_B_VIKUNJA_TOKEN     prompt person B: a Vikunja API token made by them
POUROVER_USER_B_NTFY_TOPIC        prompt optional person B: their ntfy topic (blank = none)
POUROVER_USER_B_NTFY_TOKEN        prompt optional person B: an ntfy token that may write that topic (blank = none)

# ── meowGram's bot (its Release 2): all blank until that ships ──────────────
POUROVER_MEOWGRAM_URL             prompt optional meowGram's base URL for the bot API (blank = bot off)
POUROVER_MEOWGRAM_BOT_USER        prompt optional the bot's LLDAP username (in meowGram's bot group)
POUROVER_MEOWGRAM_BOT_PASSWORD    prompt optional the bot's password
POUROVER_MEOWGRAM_CHANNEL         prompt optional the meowGram channel id pourOver works in (blank = the shared lounge)
POUROVER_MEOWGRAM_TRIGGER         value @pourover

NOTE pourOver: the LLM service account and both Vikunja tokens must exist before the first up (stacks/grinder/pourover/README.md).
