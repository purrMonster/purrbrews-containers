# Open WebUI: chat with the models on roastery's GPU.
#
# Ollama on roastery has no auth of its own. Once it's bound to localhost
# behind roastery's Traefik and Authelia (stacks/roastery/traefik), this
# plain-HTTP URL stops answering, and pointing it at ollama.${DOMAIN} doesn't
# help: Open WebUI can't do the Authelia login. That needs machine-to-machine
# auth that keeps Authelia in front; see the README's known gaps.
#
# Image: pinned 2026-09-29 by digest to the `main` build that was running
# (reports 0.11.3, but it isn't the v0.11.3 release: different digest, and it may
# carry newer database migrations, so moving to the release could be a
# downgrade). Move to a release tag the next time one is newer than this.
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
    container_name: openwebui
    environment:
      OLLAMA_BASE_URL: http://${ROASTERY_LAN_IP}:11434
      WEBUI_AUTH: "true"
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR:?}/openwebui:/app/backend/data
    # The way in when Traefik or Authelia is down; the first account made
    # becomes the admin. Never combine this port with trusted-header SSO:
    # anyone on the LAN could send the header.
    ports:
      - "8081:8080"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls.certresolver=cloudflare"
      - "traefik.http.routers.openwebui.middlewares=authelia-forwardauth@file"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

networks:
  default:
    name: grinder_net
    external: true
