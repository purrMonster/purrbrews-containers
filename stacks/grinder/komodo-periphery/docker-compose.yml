# Komodo Periphery — standalone agent added 2026-09-16, same pattern as
# stacks/sieve/komodo-periphery/docker-compose.yml (see that file's own
# header comment). grinder differs only in PERIPHERY_CONNECT_AS below.
# infrastructure.md §4: "grinder holds nothing household-critical" — this
# agent is exactly what makes it useful as the fleet's landing zone when
# another node dies (Komodo can redeploy a stack here from the UI without
# an SSH session).
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    init: true
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://${CELLAR_LAN_IP}:9120
      PERIPHERY_CONNECT_AS: grinder
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - ./keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
    restart: unless-stopped
