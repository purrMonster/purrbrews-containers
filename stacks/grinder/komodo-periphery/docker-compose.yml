# Komodo Periphery — standalone agent added 2026-09-16, same pattern as
# stacks/sieve/komodo-periphery/docker-compose.yml (see that file's own
# header comment, including the CONFIRMED 2026-09-17 note on why
# PERIPHERY_ONBOARDING_KEY, below, is required for first connect, not just
# core.pub). grinder differs only in PERIPHERY_CONNECT_AS below.
# infrastructure.md §4: "grinder holds nothing household-critical" — this
# agent is exactly what makes it useful as the fleet's landing zone when
# another node dies (Komodo can redeploy a stack here from the UI without
# an SSH session).
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    init: true
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://${CELLAR_LAN_IP}:9120
      PERIPHERY_CONNECT_AS: grinder
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      # One-time bootstrap credential — see sieve's komodo-periphery/
      # docker-compose.yml header comment. Blank/REPLACE_ME is fine once
      # this node is a registered Server in Komodo.
      PERIPHERY_ONBOARDING_KEY: ${PERIPHERY_ONBOARDING_KEY}
      # Works around moghtech/komodo issue #1425 -- see sieve's
      # komodo-periphery/docker-compose.yml header comment. Periphery
      # generates the actual key file itself on first successful boot;
      # nothing to create by hand.
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - ./keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
    restart: unless-stopped
