# Traefik: HTTPS for every grinder app with a UI, behind Authelia on
# percolator (config/dynamic.yml.template).
#
# Every app also keeps its own port published, and unlike cellar's Scrutiny
# every one of them has a real login of its own there. That's the way in
# when Authelia or Traefik is down.
#
# Image: traefik:v3.7.13. v3.2's Docker client was too old for the upgraded
# engine ("client version 1.24 is too old") and the docker provider looped.
services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${DATA_DIR:?}/traefik/acme:/acme
      # Read-only, for the labels (ESPHome's included, host network and all).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

networks:
  default:
    name: grinder_net
    external: true
