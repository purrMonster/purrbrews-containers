# roastery: the Windows workstation, not a fleet node. It serves the bootstrap
# container (../../bootstrap), lends its GPU to Immich and to llama-swap (the
# local LLMs, which replaced Ollama 2026-10-07), and holds
# the fleet's backup repository. Docker Desktop, so there is no init, no
# /opt/purrbrews/.env and no DATA_DIR; apps keep their data next to them.
#
# Use the .ps1 scripts from PowerShell; the .sh ones work from Git Bash if
# python3 is installed there.

APPS=(immich-ml komodo-periphery llama-swap)

# Nothing here talks to anything else here by container name, so no shared network.
NETWORK=''

# Not provisioned by init/purrbrews-init.sh.
NEEDS_INIT=false
