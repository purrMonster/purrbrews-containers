# immich-machine-learning on roastery's 3080, so percolator's Immich doesn't
# do face recognition and smart search on its CPU.
#
# The tag must match immich-server on percolator exactly
# (stacks/percolator/immich/docker-compose.yml). Bump both together.
#
# It has no authentication at all ("no security measures whatsoever", in
# Immich's words). The only guard is a Windows Defender Firewall rule letting
# percolator, and only percolator, reach 3003. A Linux firewall inside WSL
# does nothing here: Docker Desktop's engine runs in its own VM.
#
# Image: ghcr.io/immich-app/immich-machine-learning:v3.2.1-cuda.
services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.1-cuda
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      # Model weights, next to this file and gitignored. roastery has no DATA_DIR.
      - ./model-cache:/cache
    ports:
      # All interfaces on purpose: the Windows firewall rule does the
      # restricting, and Docker Desktop's ports go through the real Windows
      # network stack, so that rule actually applies.
      - "3003:3003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # No healthcheck: I haven't checked whether the image has curl or wget
    # for its /ping. Check by hand (README.md).
