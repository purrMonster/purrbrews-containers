# The model files config.yaml loads, pinned like everything else in this repo:
# a Hugging Face repository at a fixed revision, and the file's SHA-256 (the
# LFS object id Hugging Face publishes). fetch-models.sh downloads exactly
# these into the llm-models volume and refuses a file whose hash differs.
#
# To change a model: pick the repo and file, then take `sha` from
#   https://huggingface.co/api/models/<repo>
# and the file's `lfs.oid` from
#   https://huggingface.co/api/models/<repo>/tree/<sha>
# Update config.yaml's --model path in the same commit.
#
