# Komodo Periphery — standalone agent added 2026-09-16, best-effort on
# Windows/Docker Desktop. Container management (start/stop/logs/redeploy
# for immich-ml, docker compose actions in general) works the same way it
# does on every Linux node, since Docker Desktop's containers are ordinary
# Linux containers running inside its WSL2 VM and /var/run/docker.sock is
# exposed into them the same way. See ../scrutiny-collector's absence
# (deliberately not added — see that decision recorded in
# ../local.env.example's own comment) for the one thing that does NOT
# carry over from the Linux fleet.
#
# UNVERIFIED, same caveat as every other node's copy but more so here:
# this has only been reasoned about, never actually brought up on Docker
# Desktop for Windows. Confirm before relying on it:
#   - PERIPHERY_ROOT_DIRECTORY (/etc/komodo below) is a path INSIDE the
#     Linux container/WSL2 VM, not a Windows path — no drive-letter
#     translation needed, but confirm the bind mount below actually
#     persists across a `wsl --shutdown` / Docker Desktop restart the same
#     way it does on native Linux (Docker Desktop's own volume/bind-mount
#     backing store works differently under the hood).
#   - PERIPHERY_CORE_PUBLIC_KEYS: unlike every other node, core.pub is NOT
#     templated through .env.local here (PEM content doesn't round-trip
#     through setup-secrets.ps1's single-line substitution) -- copy
#     cellar's /srv/data/komodo/keys/core.pub by hand straight into
#     .\keys\core.pub next to this file. See ../local.env.example's own
#     comment on why.
#
# See stacks/sieve/komodo-periphery/docker-compose.yml's header comment
# for the full story, including the 2026-09-17 note on matching the
# pre-restructure purrbrews-infra repo's exact (working) env var wiring:
# core.pub alone is NOT enough for first connect --
# PERIPHERY_ONBOARDING_KEY below is also required, generated from cellar's
# Komodo UI. Unlike every other node this one IS templated through
# .env.local (single-line value, no PEM round-trip problem) -- see
# ../local.env.example, which now writes this key unquoted (matching the
# old repo, and this repo's own sieve/generate-secrets.sh) since quoted
# storage was traced as the actual cause of a key-parsing failure here.
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    init: true
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://${CELLAR_LAN_IP}:9120
      PERIPHERY_CONNECT_AS: roastery
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      # One-time bootstrap credential, from .env.local (see this file's
      # header comment) — blank/REPLACE_ME is fine once this node is a
      # registered Server in Komodo.
      PERIPHERY_ONBOARDING_KEY: ${PERIPHERY_ONBOARDING_KEY}   # remove
        # this line entirely (and re-run compose up -d) once roastery
        # already exists as a Server in Komodo's UI -- it's only needed
        # for the first-ever connection.
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - ./keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      # No /proc bind mount here, unlike the Linux nodes' copies of this
      # file -- Docker Desktop's WSL2 VM's /proc is not the same thing as
      # a native Linux host's, and Periphery's use of it (process-level
      # stats for the host it's managing) is meaningless for a Windows
      # workstation anyway. Left out deliberately, not an oversight.
      - /etc/komodo:/etc/komodo
    restart: unless-stopped
