# Komodo Periphery on roastery: the Linux nodes' agent, adjusted for Docker
# Desktop. Its containers are ordinary Linux containers in Docker Desktop's
# VM, so start/stop/logs/redeploy work as anywhere else. No Scrutiny
# collector here: Docker Desktop doesn't hand raw Windows disks to smartctl.
#
# Before the first `up`: copy cellar's /srv/data/komodo/keys/core.pub into
# .\keys\core.pub (gitignored). First connect also needs
# PERIPHERY_ONBOARDING_KEY in .env.local; leave it empty afterwards.
#
# Not verified on Docker Desktop: whether /etc/komodo (a path inside the VM)
# survives `wsl --shutdown` or a Docker Desktop restart.
#
# Image: ghcr.io/moghtech/komodo-periphery:2.3.2, same as Core.
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.2
    container_name: komodo-periphery
    init: true
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://${CELLAR_LAN_IP}:9120
      PERIPHERY_CONNECT_AS: roastery
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ONBOARDING_KEY: ${PERIPHERY_ONBOARDING_KEY:-}
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - ./keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      # No /proc: the VM's isn't roastery's, and host process stats for a
      # Windows desktop mean nothing anyway.
      - /etc/komodo:/etc/komodo
    restart: unless-stopped
