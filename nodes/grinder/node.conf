# grinder: automation and AI, and the household's growing data: photos
# (Immich), files (OpenCloud) and documents (Paperless), moved here from
# percolator for the 1 TB disk (owner, 2026-11-23). The self-tracking apps went
# to percolator, ESPHome to cellar and Speedtest Tracker to sieve the same day.

# Bring-up order. The database and the embedding worker before n8n, which
# calls both. litellm (the one door to the cloud model, replacing roastery's
# local LLMs) before the two apps that talk to it, Open WebUI and pourover.
# immich-ml before Immich, which uses it over this node's proxy network
# (moved here from percolator, owner 2026-11-23); OpenCloud and Paperless
# after it. pourover is optional (fleet.json): it only comes up when asked for.
APPS=(postgres-vector embedding-worker n8n litellm immich-ml immich opencloud paperless openwebui pourover traefik komodo-periphery scrutiny-collector)

# Host-side folders that aren't containers but have settings to fill in.
TOOLS=(restic)

# Everything joins proxy. The subnet is fixed so firewall.sh works on a node
# that has never run a container.
NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET
