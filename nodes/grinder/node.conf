# grinder: automation, AI and the self-tracking apps. Nothing here is
# household-critical, which is the point: it's cheap to shed, so its free
# memory is where things land when another node dies.

# Bring-up order. The database and the embedding worker before n8n, which
# calls both. litellm (the one door to the cloud model, replacing roastery's
# local LLMs) before the two apps that talk to it, Open WebUI and pourover.
# immich-ml serves percolator's Immich on this node's CPU. pourover is
# optional (fleet.json): it only comes up when asked for.
APPS=(postgres-vector embedding-worker n8n litellm immich-ml openwebui karakeep fittrackee traccar esphome speedtest-tracker pourover traefik komodo-periphery scrutiny-collector)

# Host-side folders that aren't containers but have settings to fill in.
TOOLS=(restic)

# Everything joins proxy except ESPHome (host network). The subnet is fixed
# so firewall.sh works on a node that has never run a container.
NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET
