# cellar: backups, file shares, and the fleet's ops tools (Komodo, the
# Scrutiny hub). Always on, so the backup schedule lives here, and since the
# 2026-11 rebuild so does the restic repository itself (it was on roastery).

# Bring-up order. Komodo first so the other nodes' Periphery agents have
# something to register with, Scrutiny so their collectors have somewhere
# to report, then Traefik for the two web UIs. persian-perch last: it reads
# Komodo and Scrutiny and routes through Traefik. smb and persian-perch are
# optional (fleet.json). NFS isn't a container; see stacks/backup/nfs.
APPS=(komodo scrutiny traefik smb persian-perch)

# Host-side folders that aren't containers but have settings to fill in.
TOOLS=(restic)

# The backup hub: the dump store, the Drive copy, prune and the checks run
# here, and this node makes the repository password the others paste.
BACKUP_HUB=true

NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET
