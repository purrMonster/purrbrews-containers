# cellar: backups, file shares, the fleet's ops tools (Komodo, the Scrutiny
# hub) and Home Assistant. Always on, so the backup schedule lives here, and
# since the 2026-11 rebuild so does the restic repository itself (it was on
# roastery). Home Assistant moved here from mochaPot on 2026-11-22: built-in
# Ethernet, the quietest node, and not percolator, so the house keeps working
# when sign-in is down (docs/hardware.md, "When a node goes down").

# Bring-up order. Komodo first so the other nodes' Periphery agents have
# something to register with, Scrutiny so their collectors have somewhere
# to report, then Traefik for the web UIs. Home Assistant before the voice apps, which
# only it talks to. persian-perch last: it reads Komodo, Scrutiny and Home
# Assistant and routes through Traefik. smb and persian-perch are
# optional (fleet.json). NFS isn't a container; see stacks/backup/nfs.
APPS=(komodo scrutiny traefik homeassistant smb whisper piper voice-satellite persian-perch)

# Host-side folders that aren't containers but have settings to fill in.
TOOLS=(restic)

# The backup hub: the dump store, the Drive copy, prune and the checks run
# here, and this node makes the repository password the others paste.
BACKUP_HUB=true

# Home Assistant is host-networked and sees Traefik's requests coming from
# this subnet, which it has to trust (stacks/home/homeassistant/README.md).
# Hence a fixed subnet.
NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET
