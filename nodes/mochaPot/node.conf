# mochaPot: music and the wall screen, plus the secondary Pi-hole. The laptop
# battery rides out a power cut, which is when a second resolver earns its
# place. Home Assistant was here until 2026-11-22 and is now on cellar: this
# node answers through a USB Ethernet adapter (docs/hardware.md).
#
# The self-tracking apps (Karakeep, FitTrackee, Traccar) are here since
# 2026-11-24 (owner), off percolator for its memory and disk. Optional in
# fleet.json: set aside for now, they only come up when asked for.

# Bring-up order. Pi-hole before Traefik: both are on the host's ports and
# Pi-hole's web UI had to move off 80 to make room.
APPS=(pihole-secondary musicassistant karakeep fittrackee traccar traefik komodo-periphery scrutiny-collector)

# Host-side folders that aren't containers: backups, and the kiosk
# (stacks/home/kiosk/README.md), whose bash_profile is rendered here.
TOOLS=(restic kiosk)

# Traefik sits on this network. Pi-hole and Music Assistant are host-networked
# and see its requests coming from this subnet; the self-tracking apps join it.
# Fixed, as on every node.
NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET

# The secondary resolver: DNS only, never DHCP.
RESOLVER=secondary
