# sieve: the network node, a ThinkCentre next to the router in the living room.
# DNS and DHCP for the house, the Cloudflare tunnel, and the alerting that has
# to keep working when everything else doesn't.

# Bring-up order. Unbound first (Pi-hole's only upstream), Pi-hole before
# anything that needs names, Traefik once there's something to route to.
# Apps are found by name under stacks/<group>/<app>.
APPS=(unbound pihole ntfy cloudflared traefik-edge gatus netalertx komodo-periphery scrutiny-collector)

# Host-side folders that aren't containers but have settings to fill in.
TOOLS=(restic)

# Every node's bridge network for Traefik and the apps it fronts is called
# proxy. The subnet is fixed so the firewall rules for host-networked Pi-hole
# and NetAlertX stay valid.
NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET

# The primary resolver: DNS plus DHCP. render-configs.sh regenerates the
# fleet's DNS records and static leases here before rendering.
RESOLVER=primary
