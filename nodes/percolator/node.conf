# percolator: ingress, identity and the household's daily apps, behind one
# Traefik and one sign-in. Immich, OpenCloud and Paperless moved to grinder for
# its disk; Karakeep, FitTrackee and Traccar came here from grinder (owner,
# 2026-11-23).

# Bring-up order; each app only depends on the ones before it. Traefik and
# CrowdSec first, then the directory and the login, then the apps.
# Apps are found by name under stacks/<group>/<app>.
APPS=(traefik-ingress crowdsec mail-relay lldap authelia radicale vaultwarden mealie vikunja meowgram actualbudget freshrss karakeep fittrackee traccar homepage purrcafe komodo-periphery scrutiny-collector whisper piper voice-satellite)

# Host-side folders that aren't containers but have settings to fill in.
TOOLS=(restic)

# Traefik and every app's web container share this network. The subnet is
# fixed because half the apps list it as their trusted proxy.
NETWORK=proxy
NETWORK_SUBNET_KEY=PROXY_SUBNET
