# purrbrews-bootstrap
#
#   /bootstrap.sh                  node-side installer (base URL injected per request)
#   /files/SHA256SUMS, /files/...  init scripts, checksummed
#   /keys/authorized_keys          public SSH keys (live from bootstrap/data)
#   /config/purrbrews-init.env     fleet settings — no secrets (checked at start)
#   /healthz                       container healthcheck

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/bootstrap.crt;
    ssl_certificate_key /certs/bootstrap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Private address space only. Behind Docker Desktop's NAT every client may
    # appear as a Docker gateway address, so Windows Firewall is the real LAN
    # boundary (see bootstrap/README.md).
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    server_tokens off;
    autoindex off;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = /bootstrap.sh {
        root /srv/www;
        sub_filter_types text/plain;
        sub_filter '__PURRBREWS_BASE_URL__' 'https://$http_host';
        sub_filter_once off;
    }

    location /files/ {
        root /srv/www;
    }

    location = /keys/authorized_keys {
        alias /data/authorized_keys;
    }

    location = /config/purrbrews-init.env {
        alias /data/purrbrews-init.env;
    }

    location / { return 404; }
}
