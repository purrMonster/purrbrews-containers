name: tests
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install offline test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml restic sqlite3 rclone openssl shellcheck jq
      - name: Validate inventory and image lock
        run: |
          python3 scripts/fleet.py validate
          python3 scripts/check-images.py
      - name: Run normal-user tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m pytest tests -q -p no:cacheprovider
      - name: Run isolated root backup tests
        run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests -q -p no:cacheprovider -k 'dump_and_files_into_a_local_repository or drive_sync_never_mirrors_an_empty_or_different_repository or glob_dumps_are_named_by_path'
      - name: Shell analysis
        run: find bootstrap init stacks tailscale -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
      - name: Scan full history for secrets
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .

  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PowerShell wrapper regression checks
        shell: powershell
        run: ./tests/test_compose_helpers.ps1
