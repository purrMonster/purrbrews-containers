# The repo's tests on every pull request and every push to main.
#
# Nodes deploy reviewed commits of main, and Dependabot opens pull requests on
# its own, so "run the tests before committing" (AGENTS.md) can't depend on
# whoever commits remembering to. A red check on a PR means: don't merge.
#
# Two runs, because the scripts under test refuse root and the backup tests
# need it: first as the runner's normal user (most of the suite), then as root with restic,
# rclone and sqlite3 for the dump, backup and drive-sync tests. shellcheck
# runs over every shell script first. The Windows jobs went to deprecated/
# with roastery in the 2026-11 rebuild.
#
# Read-only token; the action is pinned to a commit, not a tag that can move.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A hung mirror once ate the whole 15 minutes here (PR #18, 2026-10-08):
      # time the step out on its own, and let apt retry instead of waiting.
      - name: Tools the tests use
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq python3-pytest python3-yaml sqlite3 restic rclone

      # Warnings and up: unused or unset variables, bad quoting, broken tests.
      # The suite's own `bash -n` only catches syntax. shellcheck comes with
      # GitHub's Ubuntu image.
      - name: shellcheck
        run: |
          find stacks nodes payload scripts tailscale recovery -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
          # the recovery kit's live-system scripts have no .sh: they're commands
          shellcheck --severity=warning recovery/live/usr/local/sbin/* recovery/live/usr/local/bin/*

      - name: Tests (normal user)
        run: python3 -m pytest -q -rs tests

      - name: "Tests (root: dumps, backups, drive-sync)"
        run: sudo python3 -m pytest -q -rs tests
